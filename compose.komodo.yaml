# Candidate source template. Use an independently reviewed image/config copy
# for V1.6 acceptance; images below use the target release version.
# Set HOST_CONFIG_DIR/HOST_DATA_DIR in the stack environment using private
# Komodo Variables. Bind sources must already exist; no host paths live here.
# Config and media sources must be disjoint, including resolved host aliases.
services:
  nas-file-center-api:
    image: kerwinjhc/nas-file-center:1.6.1
    user: "${NFC_API_UID:-10001}:${NFC_SHARED_GID:-10000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777
    pull_policy: missing
    container_name: nas-file-center-api
    volumes:
      - type: bind
        source: ${HOST_CONFIG_DIR:?Set HOST_CONFIG_DIR in the stack environment}
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: ${HOST_CONFIG_DIR:?Set HOST_CONFIG_DIR in the stack environment}/.nas-file-center-trash
        target: /quarantine/.nas-file-center-trash
        read_only: true
        bind:
          create_host_path: false
      # The same quarantine subtree is also reachable through writable /config.
      - type: bind
        source: ${HOST_CONFIG_DIR:?Set HOST_CONFIG_DIR in the stack environment}/.nas-file-center-trash
        target: /config/.nas-file-center-trash
        read_only: true
        bind:
          create_host_path: false
      - nfc-recovery-secrets:/run/nfc-recovery-secrets
      - type: bind
        source: ${HOST_DATA_DIR:?Set HOST_DATA_DIR in the stack environment}
        target: /data
        read_only: true
        bind:
          create_host_path: false
    networks:
      - nginx_network
    environment:
      - CONFIG_DIR=/config
      - DATA_MOUNT=/data
      - ALLOWED_ROOTS=/data
      - QUARANTINE_ROOT=/quarantine/.nas-file-center-trash
      - MEDIA_PACKAGE_ROOT=[[MEDIA_PACKAGE_ROOT]]
      - MEDIA_PACKAGE_FUSE_COMPAT_ENABLED=[[MEDIA_PACKAGE_FUSE_COMPAT_ENABLED]]
      - ALLOW_MUTATION=true
      - ALLOW_DELETE=true
      - PROTECT_LAST_FILE=true
      - MEDIA_ORGANIZER_EXECUTION_ENABLED=false
      - MEDIA_ORGANIZER_EXECUTION_MODE=strict
      - MEDIA_ORGANIZER_NAMESPACE_QUIESCENCE_ACK=false
      - NFC_SHARED_CONFIG_GID=${NFC_SHARED_GID:-10000}
      - NFC_SECRET_OWNER_UID=${NFC_API_UID:-10001}
      - NFC_SECRET_GROUP_GID=${NFC_SHARED_GID:-10000}
      - FCLONES_BINARY=/usr/local/bin/fclones
      - MTIME_REFRESH_DELAY_SECONDS=2
      - SESSION_COOKIE_SECURE=true
      - INITIAL_ADMIN_USERNAME=[[INITIAL_ADMIN_USERNAME]]
      - INITIAL_ADMIN_PASSWORD=[[INITIAL_ADMIN_PASSWORD]]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8080/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  nas-file-center-worker:
    image: kerwinjhc/nas-file-center:1.6.1
    user: "${NFC_WORKER_UID:-10002}:${NFC_SHARED_GID:-10000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777
    pull_policy: missing
    container_name: nas-file-center-worker
    command:
      - python
      - -m
      - app.worker
    volumes:
      - type: bind
        source: ${HOST_CONFIG_DIR:?Set HOST_CONFIG_DIR in the stack environment}
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: ${HOST_CONFIG_DIR:?Set HOST_CONFIG_DIR in the stack environment}/.nas-file-center-trash
        target: /quarantine/.nas-file-center-trash
        bind:
          create_host_path: false
      - nfc-recovery-secrets:/run/nfc-recovery-secrets
      - type: bind
        source: ${HOST_DATA_DIR:?Set HOST_DATA_DIR in the stack environment}
        target: /data
        bind:
          create_host_path: false
    networks:
      - nginx_network
    environment:
      - CONFIG_DIR=/config
      - DATA_MOUNT=/data
      - ALLOWED_ROOTS=/data
      - QUARANTINE_ROOT=/quarantine/.nas-file-center-trash
      - MEDIA_PACKAGE_ROOT=[[MEDIA_PACKAGE_ROOT]]
      - MEDIA_PACKAGE_FUSE_COMPAT_ENABLED=[[MEDIA_PACKAGE_FUSE_COMPAT_ENABLED]]
      - ALLOW_MUTATION=true
      - ALLOW_DELETE=true
      - PROTECT_LAST_FILE=true
      - MEDIA_ORGANIZER_EXECUTION_ENABLED=false
      - MEDIA_ORGANIZER_EXECUTION_MODE=strict
      - MEDIA_ORGANIZER_NAMESPACE_QUIESCENCE_ACK=false
      - NFC_SHARED_CONFIG_GID=${NFC_SHARED_GID:-10000}
      - NFC_SECRET_OWNER_UID=${NFC_API_UID:-10001}
      - NFC_SECRET_GROUP_GID=${NFC_SHARED_GID:-10000}
      - FCLONES_BINARY=/usr/local/bin/fclones
      - MTIME_REFRESH_DELAY_SECONDS=2
    depends_on:
      nas-file-center-api:
        condition: service_healthy
    restart: unless-stopped

networks:
  nginx_network:
    external: true

# Dedicated RAM-backed named volume; no SATA/config path is mounted for passwords.
volumes:
  nfc-recovery-secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m,uid=${NFC_API_UID:-10001},gid=${NFC_SHARED_GID:-10000},mode=2770,noexec,nosuid,nodev"
