services:
  nas-file-center-api:
    image: kerwinjhc/nas-file-center:1.4.6
    user: "${NFC_API_UID:-10001}:${NFC_SHARED_GID:-10000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777
    pull_policy: missing
    container_name: nas-file-center-api
    volumes:
      - /tmp/zfsv3/nvme13/15246330601/data/NasFileCenter:/config
      - /tmp/zfsv3/sata11/15246330601/data:/data:ro
    networks:
      - nginx_network
    environment:
      - CONFIG_DIR=/config
      - DATA_MOUNT=/data
      - ALLOWED_ROOTS=/data
      - QUARANTINE_ROOT=/data/.nas-file-center-trash
      - ALLOW_MUTATION=true
      - ALLOW_DELETE=true
      - PROTECT_LAST_FILE=true
      - MEDIA_ORGANIZER_EXECUTION_ENABLED=false
      - MEDIA_ORGANIZER_NAMESPACE_QUIESCENCE_ACK=false
      - NFC_SHARED_CONFIG_GID=${NFC_SHARED_GID:-10000}
      - FCLONES_BINARY=/usr/local/bin/fclones
      - MTIME_REFRESH_DELAY_SECONDS=2
      - SESSION_COOKIE_SECURE=true
      - INITIAL_ADMIN_USERNAME=[[INITIAL_ADMIN_USERNAME]]
      - INITIAL_ADMIN_PASSWORD=[[INITIAL_ADMIN_PASSWORD]]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8080/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  nas-file-center-worker:
    image: kerwinjhc/nas-file-center:1.4.6
    user: "${NFC_WORKER_UID:-10002}:${NFC_SHARED_GID:-10000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777
    pull_policy: missing
    container_name: nas-file-center-worker
    command:
      - python
      - -m
      - app.worker
    volumes:
      - /tmp/zfsv3/nvme13/15246330601/data/NasFileCenter:/config
      - /tmp/zfsv3/sata11/15246330601/data:/data:rw
    networks:
      - nginx_network
    environment:
      - CONFIG_DIR=/config
      - DATA_MOUNT=/data
      - ALLOWED_ROOTS=/data
      - QUARANTINE_ROOT=/data/.nas-file-center-trash
      - ALLOW_MUTATION=true
      - ALLOW_DELETE=true
      - PROTECT_LAST_FILE=true
      - MEDIA_ORGANIZER_EXECUTION_ENABLED=false
      - MEDIA_ORGANIZER_NAMESPACE_QUIESCENCE_ACK=false
      - NFC_SHARED_CONFIG_GID=${NFC_SHARED_GID:-10000}
      - FCLONES_BINARY=/usr/local/bin/fclones
      - MTIME_REFRESH_DELAY_SECONDS=2
    depends_on:
      nas-file-center-api:
        condition: service_healthy
    restart: unless-stopped

networks:
  nginx_network:
    external: true
