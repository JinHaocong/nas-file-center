[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nas-dedupe-center"
version = "0.3.3.dev1"
description = "Safe NAS duplicate-file planning and execution around fclones"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0.43,<3",
  "pydantic-settings>=2.10,<3",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "argon2-cffi>=23.1.0",
  "regex>=2024.5.15",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4,<9",
  "httpx>=0.28,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*.css", "static/*.js", "static/vendor/*"]
