# Optional overlay for password-protected archive recovery.
# Apply with compose.yaml. This volume lives in tmpfs; it never stores passwords
# in a persistent /config directory or exposes them on a process command line.
services:
  api:
    volumes:
      - nfc_recovery_secrets:/run/nfc-recovery-secrets
  worker:
    volumes:
      - nfc_recovery_secrets:/run/nfc-recovery-secrets
volumes:
  nfc_recovery_secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,mode=0700