# Optional overlay for password-protected archive recovery.
# Apply with compose.yaml. This volume lives in tmpfs; it never stores passwords
# in a persistent /config directory or exposes them on a process command line.
services:
  api:
    volumes:
      - nfc-recovery-secrets:/run/nfc-recovery-secrets
  worker:
    volumes:
      - nfc-recovery-secrets:/run/nfc-recovery-secrets
volumes:
  nfc-recovery-secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m,uid=${NFC_API_UID:-10001},gid=${NFC_SHARED_GID:-10000},mode=2770,noexec,nosuid,nodev"
