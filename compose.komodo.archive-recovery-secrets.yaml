# Optional overlay for compose.komodo.yaml (password-protected recovery only).
services:
  nas-file-center-api:
    volumes:
      - nfc_recovery_secrets:/run/nfc-recovery-secrets
  nas-file-center-worker:
    volumes:
      - nfc_recovery_secrets:/run/nfc-recovery-secrets
volumes:
  nfc_recovery_secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,mode=0700