name: Gate6-B Task5 Validate Patch

on:
  push:
    branches:
      - v0.3.6-gate6b-utility-recursive-dirbal

permissions:
  contents: write

jobs:
  apply-validate-patch:
    if: "${{ github.event.head_commit.message == 'chore(gate6b): apply task5 validate patch' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact Validate patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/service.py")
          source = path.read_text(encoding="utf-8")
          old = (
              '            if not is_fresh and stale_detail:\n'
              '                stale_items.append(stale_detail)\n'
              '                item_validations[row.id] = ("stale", stale_detail.reason, None)\n'
              '                continue\n'
              '\n'
              '            if row.keep_path:\n'
          )
          new = (
              '            if not is_fresh and stale_detail:\n'
              '                stale_items.append(stale_detail)\n'
              '                item_validations[row.id] = ("stale", stale_detail.reason, None)\n'
              '                continue\n'
              '\n'
              '            row_meta_for_recursive = json.loads(row.metadata_json or "{}")\n'
              '            has_recursive_authority = (\n'
              '                isinstance(row_meta_for_recursive, dict)\n'
              '                and (\n'
              '                    "recursive_protection" in row_meta_for_recursive\n'
              '                    or "frozen_recursive_protection" in row_meta_for_recursive\n'
              '                )\n'
              '            )\n'
              '            if (\n'
              '                row.operation == "quarantine"\n'
              '                and (\n'
              '                    plan_metadata.get("selection_mode") == "recursive_directory_balanced_by_bytes"\n'
              '                    or has_recursive_authority\n'
              '                )\n'
              '            ):\n'
              '                from app.planning.recursive_protection_authority import (\n'
              '                    evaluate_live_recursive_protection,\n'
              '                )\n'
              '\n'
              '                recursive_evaluation = evaluate_live_recursive_protection(\n'
              '                    row.metadata_json or "{}",\n'
              '                    expected_source_path=row.source_path,\n'
              '                    allowed_roots=self.settings.allowed_roots,\n'
              '                    quarantine_root=self.settings.quarantine_root,\n'
              '                )\n'
              '                if not recursive_evaluation.safe:\n'
              '                    recursive_reason = (\n'
              '                        recursive_evaluation.reason\n'
              '                        or "RECURSIVE_PROTECTION_UNSTABLE"\n'
              '                    )\n'
              '                    recursive_stale = StaleItemDetail(\n'
              '                        item_id=row.id,\n'
              '                        source_path=row.source_path,\n'
              '                        reason=recursive_reason,\n'
              '                        expected={\n'
              '                            "device": row.expected_device,\n'
              '                            "inode": row.expected_inode,\n'
              '                            "size": row.expected_size,\n'
              '                            "mtime_ns": row.expected_mtime_ns,\n'
              '                            "hash": row.expected_hash,\n'
              '                        },\n'
              '                        actual=None,\n'
              '                    )\n'
              '                    stale_items.append(recursive_stale)\n'
              '                    item_validations[row.id] = ("stale", recursive_reason, None)\n'
              '                    continue\n'
              '\n'
              '            if row.keep_path:\n'
          )
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"Task5 validate anchor count must be 1, got {count}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/gate6b-task5-validate-patch.yml

      - name: Commit exact patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/service.py .github/workflows/gate6b-task5-validate-patch.yml
          git diff --cached --check
          git commit -m "feat(gate6b): recheck recursive protection at validate"
          git push origin HEAD:v0.3.6-gate6b-utility-recursive-dirbal
