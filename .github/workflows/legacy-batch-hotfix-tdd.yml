name: Legacy Batch Execution Hotfix TDD

on:
  push:
    branches:
      - hotfix/legacy-batch-execution-regressions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hotfix-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CONFIG_DIR: /tmp/nfc-config
      DATA_MOUNT: /tmp/nfc-data
      ALLOWED_ROOTS: /tmp/nfc-data
      QUARANTINE_ROOT: /tmp/nfc-data/.nas-file-center-trash
      BASELINE_SHA: afac775d6b48a3e9fcf7e8336bfd71b1abb2ab79

    steps:
      - name: Checkout exact hotfix candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify candidate ancestry and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          echo "candidate_sha=$(git rev-parse HEAD)"
          echo "baseline_sha=${BASELINE_SHA}"
          test "$(git merge-base "${BASELINE_SHA}" HEAD)" = "${BASELINE_SHA}"
          git diff --check "${BASELINE_SHA}...HEAD"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install backend test dependencies
        run: python -m pip install -e '.[test]'

      - name: Run focused hotfix regressions
        env:
          PYTHONPATH: .
        run: >-
          pytest
          tests/test_legacy_batch_execution_regressions.py
          tests/test_legacy_batch_recursive_rename_regressions.py
          tests/test_gate6a2_unlink_purge_terminal_audit.py
          -v

      - name: Run full backend regression
        env:
          PYTHONPATH: .
        run: pytest --disable-warnings -q

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Run frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend production build
        working-directory: frontend
        run: npm run build
