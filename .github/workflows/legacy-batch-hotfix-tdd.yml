name: Legacy Batch Execution Hotfix TDD

on:
  push:
    branches:
      - hotfix/legacy-batch-execution-regressions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  focused-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONFIG_DIR: /tmp/nfc-config
      DATA_MOUNT: /tmp/nfc-data
      ALLOWED_ROOTS: /tmp/nfc-data
      QUARANTINE_ROOT: /tmp/nfc-data/.nas-file-center-trash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply minimal stale/expired deletion fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/service.py")
          text = path.read_text(encoding="utf-8")
          old = '''PLAN_SINGLE_DELETE_ALLOWED = {
              "draft",
              "frozen",
              "ready",
              "partial",
              "completed",
              "failed",
          }
          '''
          new = '''PLAN_SINGLE_DELETE_ALLOWED = {
              "draft",
              "frozen",
              "ready",
              "partial",
              "completed",
              "failed",
              "stale",
              "expired",
          }
          '''
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("expected PLAN_SINGLE_DELETE_ALLOWED block not found")
          PY

          if ! git diff --quiet -- app/service.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/service.py
            git commit -m "fix: allow deletion of stale and expired plans"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Apply COMPAT regular-file rename fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/execution/executor.py")
          text = path.read_text(encoding="utf-8")

          helper_old = '''def _count_regular_files(root: Path) -> int:
              count = 0
              for current, dirnames, filenames in os.walk(root, followlinks=False):
                  current_path = Path(current)
                  dirnames[:] = [d for d in dirnames if not (current_path / d).is_symlink()]
                  for name in filenames:
                      p = current_path / name
                      if not p.is_symlink() and p.is_file():
                          count += 1
              return count


          def _containing_root'''
          helper_new = '''def _count_regular_files(root: Path) -> int:
              count = 0
              for current, dirnames, filenames in os.walk(root, followlinks=False):
                  current_path = Path(current)
                  dirnames[:] = [d for d in dirnames if not (current_path / d).is_symlink()]
                  for name in filenames:
                      p = current_path / name
                      if not p.is_symlink() and p.is_file():
                          count += 1
              return count


          def _compat_regular_file_move_noreplace(source: Path, target: Path) -> None:
              """Fallback for filesystems without native RENAME_NOREPLACE.

              Hard-link publication provides atomic no-clobber target creation. The source
              binding is removed only after publication succeeds. Directories and special
              files remain unsupported so the fallback cannot silently weaken semantics.
              """
              source_stat = os.lstat(source)
              if not stat.S_ISREG(source_stat.st_mode):
                  raise OSError(
                      errno.EOPNOTSUPP,
                      "COMPAT no-replace move supports regular files only",
                      os.fspath(source),
                  )

              os.link(source, target, follow_symlinks=False)
              try:
                  os.unlink(source)
              except OSError as unlink_error:
                  try:
                      os.unlink(target)
                  except OSError as rollback_error:
                      raise OSError(
                          errno.EIO,
                          f"COMPAT no-replace move rollback failed: {rollback_error}",
                          os.fspath(source),
                      ) from unlink_error
                  raise


          def _containing_root'''
          if helper_old in text:
              text = text.replace(helper_old, helper_new, 1)
          elif "def _compat_regular_file_move_noreplace" not in text:
              raise SystemExit("expected executor helper anchor not found")

          rename_old = '''            try:
                          from app.fs_ops import rename_noreplace
                          rename_noreplace(source, target)
                      except FileExistsError:
                          return _skip("target already exists")
                      except OSError as exc:
                          return ItemResult("failed", str(exc))
                      return ItemResult("completed", "moved", target)
          '''
          rename_new = '''            try:
                          from app.fs_ops import rename_noreplace
                          try:
                              rename_noreplace(source, target)
                          except OSError as exc:
                              if exc.errno != errno.EOPNOTSUPP:
                                  raise
                              _compat_regular_file_move_noreplace(source, target)
                      except FileExistsError:
                          return _skip("target already exists")
                      except OSError as exc:
                          return ItemResult("failed", str(exc))
                      return ItemResult("completed", "moved", target)
          '''
          if rename_old in text:
              text = text.replace(rename_old, rename_new, 1)
          elif "_compat_regular_file_move_noreplace(source, target)" not in text:
              raise SystemExit("expected rename execution block not found")

          path.write_text(text, encoding="utf-8")
          PY

          if ! git diff --quiet -- app/execution/executor.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/execution/executor.py
            git commit -m "fix: support no-clobber file rename on compat filesystems"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Apply recursive directory rename preview fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/service.py")
          text = path.read_text(encoding="utf-8")
          old = '''    def rename_preview(self, paths: list[str], rule: RenameRule) -> list[dict]:
                  sources = [require_allowed_path(path, self.settings.allowed_roots) for path in paths]
                  sources.sort(key=str)
                  source_set = set(sources)
          '''
          new = '''    def rename_preview(self, paths: list[str], rule: RenameRule) -> list[dict]:
                  requested_sources = [require_allowed_path(path, self.settings.allowed_roots) for path in paths]
                  sources: list[Path] = []
                  seen_sources: set[Path] = set()

                  for requested_source in requested_sources:
                      if requested_source.is_dir() and not requested_source.is_symlink():
                          for current, dirnames, filenames in os.walk(requested_source, followlinks=False):
                              current_path = Path(current)
                              dirnames[:] = sorted(
                                  name for name in dirnames
                                  if not (current_path / name).is_symlink()
                              )
                              for name in sorted(filenames):
                                  candidate = current_path / name
                                  if candidate.is_symlink() or not candidate.is_file():
                                      continue
                                  safe_candidate = require_allowed_path(candidate, self.settings.allowed_roots)
                                  if safe_candidate not in seen_sources:
                                      seen_sources.add(safe_candidate)
                                      sources.append(safe_candidate)
                          continue

                      if requested_source not in seen_sources:
                          seen_sources.add(requested_source)
                          sources.append(requested_source)

                  sources.sort(key=str)
                  source_set = set(sources)
          '''
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif "requested_sources = [require_allowed_path(path, self.settings.allowed_roots) for path in paths]" not in text:
              raise SystemExit("expected rename_preview source expansion block not found")
          PY

          if ! git diff --quiet -- app/service.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/service.py
            git commit -m "fix: recurse directory scopes for batch rename preview"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Remove ordering assumption from recursive rename regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_legacy_batch_execution_regressions.py")
          text = path.read_text(encoding="utf-8")
          old = '''    assert [row["source"] for row in preview] == [str(first), str(second)]
              assert [row["target"] for row in preview] == [
                  str(scope / "REN-track 01.flac"),
                  str(nested / "REN-track 02.flac"),
              ]
          '''
          new = '''    assert {row["source"]: row["target"] for row in preview} == {
                  str(first): str(scope / "REN-track 01.flac"),
                  str(second): str(nested / "REN-track 02.flac"),
              }
          '''
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif 'assert {row["source"]: row["target"] for row in preview}' not in text:
              raise SystemExit("expected recursive rename regression assertions not found")
          PY

          if ! git diff --quiet -- tests/test_legacy_batch_execution_regressions.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/test_legacy_batch_execution_regressions.py
            git commit -m "test: make recursive rename regression order-independent"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e '.[test]'

      - name: Run focused legacy batch regressions
        env:
          PYTHONPATH: .
        run: >-
          pytest
          tests/test_legacy_batch_execution_regressions.py
          tests/test_gate6a2_unlink_purge_terminal_audit.py
          -v
