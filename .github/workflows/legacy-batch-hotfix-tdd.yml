name: Legacy Batch Execution Hotfix TDD

on:
  push:
    branches:
      - hotfix/legacy-batch-execution-regressions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  focused-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONFIG_DIR: /tmp/nfc-config
      DATA_MOUNT: /tmp/nfc-data
      ALLOWED_ROOTS: /tmp/nfc-data
      QUARANTINE_ROOT: /tmp/nfc-data/.nas-file-center-trash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply minimal stale/expired deletion fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/service.py")
          text = path.read_text(encoding="utf-8")
          old = '''PLAN_SINGLE_DELETE_ALLOWED = {
              "draft",
              "frozen",
              "ready",
              "partial",
              "completed",
              "failed",
          }
          '''
          new = '''PLAN_SINGLE_DELETE_ALLOWED = {
              "draft",
              "frozen",
              "ready",
              "partial",
              "completed",
              "failed",
              "stale",
              "expired",
          }
          '''
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("expected PLAN_SINGLE_DELETE_ALLOWED block not found")
          PY

          if ! git diff --quiet -- app/service.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/service.py
            git commit -m "fix: allow deletion of stale and expired plans"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e '.[test]'

      - name: Run focused legacy batch regressions
        env:
          PYTHONPATH: .
        run: pytest tests/test_legacy_batch_execution_regressions.py -v
