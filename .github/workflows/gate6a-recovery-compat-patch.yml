name: Gate6-A Recovery Compatibility Patch

on:
  push:
    branches:
      - v0.3.6-gate6a-quarantine-bulk-operations
    paths:
      - .github/workflows/gate6a-recovery-compat-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact recovery compatibility patch
        run: python .github/gate6a_recovery_compat_patch.py
      - name: Commit production fix and remove temporary patch files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kerwin"
          git config user.email "100753463+JinHaocong@users.noreply.github.com"
          git rm .github/workflows/gate6a-recovery-compat-patch.yml .github/gate6a_recovery_compat_patch.py
          git add app/tasks/handlers.py app/quarantine/reconcile.py
          git diff --cached --check
          git commit -m "fix(gate6a): preserve legacy recovery while enforcing frozen authority"
          git push origin HEAD:v0.3.6-gate6a-quarantine-bulk-operations
