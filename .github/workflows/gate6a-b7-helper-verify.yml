name: Gate6-A B7 Helper Verify

on:
  push:
    branches:
      - ops/gate6a-b7-green-helper
    paths:
      - .github/workflows/gate6a-b7-helper-verify.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/gate6a-b7-green-helper
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply literal B7 patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/b7.patch <<'PATCH'
          diff --git a/app/execution/executor.py b/app/execution/executor.py
          --- a/app/execution/executor.py
          +++ b/app/execution/executor.py
          @@ -77,8 +77,25 @@ def execute_item(
                       "failed",
                       "EOPNOTSUPP: quarantine purge requires worker authority, session_factory, quarantine_entry_id, and frozen purge manifest",
                   )
          -        if item.expected_hash:
          -            from app.models import QuarantineEntry
          +        if (
          +            item.expected_device is None
          +            or item.expected_inode is None
          +            or item.expected_size is None
          +            or item.expected_mtime_ns is None
          +            or not item.expected_hash
          +        ):
          +            return ItemResult(
          +                "failed",
          +                "PURGE_FROZEN_IDENTITY_MISSING: BatchPlanItem.expected_* is required",
          +            )
          +        frozen_identity = (
          +            int(item.expected_device),
          +            int(item.expected_inode),
          +            int(item.expected_size),
          +            int(item.expected_mtime_ns),
          +            str(item.expected_hash).lower(),
          +        )
          +        frozen_purge_authority = dict(purge_manifest)
          +        frozen_purge_authority["frozen_payload_identity"] = {
          +            "device": frozen_identity[0],
          +            "inode": frozen_identity[1],
          +            "size": frozen_identity[2],
          +            "mtime_ns": frozen_identity[3],
          +            "content_hash": frozen_identity[4],
          +        }
          +        from app.models import QuarantineEntry
           
          -            with session_factory() as session:
          +        with session_factory() as session:
                       q_entry = session.get(QuarantineEntry, quarantine_entry_id)
                       if q_entry is None:
                           return ItemResult(
          @@ -86,14 +103,6 @@ def execute_item(
                               "failed",
                               f"PURGE_FROZEN_IDENTITY_CHANGED: quarantine entry #{quarantine_entry_id} no longer exists",
                           )
          -                frozen_identity = (
          -                    int(item.expected_device),
          -                    int(item.expected_inode),
          -                    int(item.expected_size),
          -                    int(item.expected_mtime_ns),
          -                    str(item.expected_hash).lower(),
          -                )
                       current_identity = (
                           int(q_entry.device or 0),
                           int(q_entry.inode or 0),
          @@ -115,7 +124,7 @@ def execute_item(
                       session_factory,
                       quarantine_entry_id,
                       worker_id,
          -                purge_manifest,
          +                frozen_purge_authority,
                       quarantine_root,
                       list(allowed_roots),
                   )
          @@ -123,7 +132,7 @@ def execute_item(
                       session_factory,
                       quarantine_entry_id,
                       worker_id,
          -                purge_manifest,
          +                frozen_purge_authority,
                       quarantine_root,
                       list(allowed_roots),
                   )
          diff --git a/app/quarantine/purge.py b/app/quarantine/purge.py
          --- a/app/quarantine/purge.py
          +++ b/app/quarantine/purge.py
          @@ -26,11 +26,19 @@ def build_purge_topology_manifest(
               owner_lookup: Callable[[int], Any | None] | None = None,
           ) -> dict[str, Any]:
               """Build the read-only Gate6-A transactional purge topology manifest."""
          -    return _build_preview_purge_topology_manifest(
          +    manifest = _build_preview_purge_topology_manifest(
                   entry,
                   quarantine_root,
                   owner_lookup=owner_lookup,
               )
          +    manifest["frozen_payload_identity"] = {
          +        "device": entry.device,
          +        "inode": entry.inode,
          +        "size": entry.size,
          +        "mtime_ns": entry.mtime_ns,
          +        "content_hash": str(entry.content_hash or "").lower(),
          +    }
          +    return manifest
           
           
           def validate_purge_topology_manifest(
          @@ -47,6 +55,27 @@ def validate_purge_topology_manifest(
               return None
           
           
          +def _require_frozen_payload_identity(
          +    frozen_manifest: dict[str, Any],
          +) -> tuple[int, int, int, int, str]:
          +    raw = frozen_manifest.get("frozen_payload_identity")
          +    if not isinstance(raw, dict):
          +        raise StateConflictError("PURGE_FROZEN_IDENTITY_MISSING: frozen payload identity is required")
          +    required = ("device", "inode", "size", "mtime_ns", "content_hash")
          +    if any(raw.get(key) is None for key in required):
          +        raise StateConflictError("PURGE_FROZEN_IDENTITY_MISSING: frozen payload identity is incomplete")
          +    try:
          +        device = int(raw["device"])
          +        inode = int(raw["inode"])
          +        size = int(raw["size"])
          +        mtime_ns = int(raw["mtime_ns"])
          +    except (TypeError, ValueError) as exc:
          +        raise StateConflictError("PURGE_FROZEN_IDENTITY_MISSING: frozen payload identity is invalid") from exc
          +    content_hash = str(raw.get("content_hash") or "").lower()
          +    if not content_hash:
          +        raise StateConflictError("PURGE_FROZEN_IDENTITY_MISSING: frozen payload hash is required")
          +    return device, inode, size, mtime_ns, content_hash
          +
          +
           def classify_cross_entry_alias_owner(
               selected_entry: Any,
               owner: Any | None,
          @@ -177,7 +206,24 @@ def _begin_transactional_purge_intent(
                       f"Quarantine entry #{entry_id} must still be active before purge "
                       f"(state={state}, tx_phase={tx_phase})"
                   )
          -        if frozen_manifest is not None and quarantine_root is not None:
          +        if frozen_manifest is None:
          +            session.rollback()
          +            raise StateConflictError("PURGE_FROZEN_IDENTITY_MISSING: frozen purge authority is required")
          +        expected_identity = _require_frozen_payload_identity(frozen_manifest)
          +        current_identity = (
          +            int(entry.device or 0),
          +            int(entry.inode or 0),
          +            int(entry.size or 0),
          +            int(entry.mtime_ns or 0),
          +            str(entry.content_hash or "").lower(),
          +        )
          +        if current_identity != expected_identity:
          +            session.rollback()
          +            raise StateConflictError(
          +                f"PURGE_FROZEN_IDENTITY_CHANGED: quarantine entry #{entry_id} identity changed after Freeze"
          +            )
          +        if quarantine_root is not None:
                       ownership_reason = _intent_time_purge_ownership_reason(
                           session,
                           entry,
          @@ -655,14 +701,12 @@ def qualify_transactional_purge_capture(
                       f"(state={entry.state}, tx_phase={entry.tx_phase})"
                   )
                   generation = int(entry.active_attempt_generation or 0)
          -        expected_device = entry.device
          -        expected_inode = entry.inode
          -        expected_size = entry.size
          -        expected_mtime_ns = entry.mtime_ns
          -        expected_hash = (entry.content_hash or "").lower()
           
          -    if generation <= 0 or not expected_hash:
          +    expected_device, expected_inode, expected_size, expected_mtime_ns, expected_hash = (
          +        _require_frozen_payload_identity(frozen_manifest)
          +    )
          +    if generation <= 0:
                   raise StateConflictError("PURGE_QUALIFICATION_FAILED: missing frozen payload identity")
           
               q_root = Path(quarantine_root)
          @@ -837,14 +881,12 @@ def destroy_transactional_purge_capture(
                       f"(state={entry.state}, tx_phase={entry.tx_phase})"
                   )
                   generation = int(entry.active_attempt_generation or 0)
          -        expected_device = entry.device
          -        expected_inode = entry.inode
          -        expected_size = entry.size
          -        expected_mtime_ns = entry.mtime_ns
          -        expected_hash = (entry.content_hash or "").lower()
           
          -    if generation <= 0 or not expected_hash:
          +    expected_device, expected_inode, expected_size, expected_mtime_ns, expected_hash = (
          +        _require_frozen_payload_identity(frozen_manifest)
          +    )
          +    if generation <= 0:
                   raise StateConflictError("PURGE_DESTRUCTION_FAILED: missing frozen payload identity")
           
               q_root = Path(quarantine_root)
          @@ -976,6 +1018,27 @@ def destroy_transactional_purge_capture(
                       f"Quarantine entry #{entry_id} purge generation changed "
                       f"(expected={generation}, current={current_generation})"
                   )
          +        current_identity = (
          +            int(entry.device or 0),
          +            int(entry.inode or 0),
          +            int(entry.size or 0),
          +            int(entry.mtime_ns or 0),
          +            str(entry.content_hash or "").lower(),
          +        )
          +        if current_identity != (
          +            expected_device,
          +            expected_inode,
          +            expected_size,
          +            expected_mtime_ns,
          +            expected_hash,
          +        ):
          +            session.rollback()
          +            raise StateConflictError(
          +                f"PURGE_FROZEN_IDENTITY_CHANGED: quarantine entry #{entry_id} identity changed before terminal purge commit"
          +            )
                   entry.state = "purged"
                   entry.tx_phase = "purged"
                   entry.purged_at = utcnow()
          diff --git a/tests/test_gate6a_transactional_purge_executor.py b/tests/test_gate6a_transactional_purge_executor.py
          --- a/tests/test_gate6a_transactional_purge_executor.py
          +++ b/tests/test_gate6a_transactional_purge_executor.py
          @@ -74,7 +74,16 @@ def test_quarantine_purge_executor_routes_authorized_transaction_to_terminal_pu
               assert frozen_manifest["blockers"] == []
           
               result = execute_item(
          -        OperationItem(sequence=1, operation="quarantine_purge", source=public_view),
          +        OperationItem(
          +            sequence=1,
          +            operation="quarantine_purge",
          +            source=public_view,
          +            expected_device=st.st_dev,
          +            expected_inode=st.st_ino,
          +            expected_size=st.st_size,
          +            expected_mtime_ns=st.st_mtime_ns,
          +            expected_hash=hashlib.sha256(payload).hexdigest(),
          +        ),
                   allowed_roots=[data],
                   allow_mutation=True,
                   allow_delete=True,
          @@ -184,7 +193,16 @@ def test_quarantine_purge_executor_revalidates_historical_owner_before_capture(
               session.commit()
           
               result = execute_item(
          -        OperationItem(sequence=1, operation="quarantine_purge", source=public_view),
          +        OperationItem(
          +            sequence=1,
          +            operation="quarantine_purge",
          +            source=public_view,
          +            expected_device=st.st_dev,
          +            expected_inode=st.st_ino,
          +            expected_size=st.st_size,
          +            expected_mtime_ns=st.st_mtime_ns,
          +            expected_hash=payload_hash,
          +        ),
                   allowed_roots=[data],
                   allow_mutation=True,
                   allow_delete=True,
          PATCH

          git apply --check /tmp/b7.patch
          git apply /tmp/b7.patch
          python -m py_compile app/execution/executor.py app/quarantine/purge.py
          git diff --check

      - name: Install tests
        run: python -m pip install -e '.[test]'

      - name: Verify B7 and preserved destructive regressions
        run: >-
          pytest
          tests/test_gate6a_transactional_purge_b7_frozen_identity_intent_race.py
          tests/test_gate6a_transactional_purge_executor.py
          tests/test_gate6a_transactional_purge_intent_race.py
          tests/test_gate6a_transactional_purge_capture.py
          tests/test_gate6a_transactional_purge_qualification.py
          tests/test_gate6a_transactional_purge_destroy.py
          tests/test_gate6a_purge_recovery*.py
          tests/test_gate5g_g7_task11_cleanup_gate.py
          tests/test_gate5g_g7_task8_restore.py
          tests/test_gate5g_g7_hotfix2_worker_restore_authority.py
          tests/test_gate5g_g7_hotfix3_restore_takeover_generation.py
          tests/test_v0351_zfuse_ctime_stability.py
          -v

      - name: Commit helper only after GREEN
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/gate6a-b7-remediation-runner.yml
          git rm .github/workflows/gate6a-b7-helper-verify.yml
          git diff --check
          git config user.name "gate6a-remediation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/execution/executor.py app/quarantine/purge.py tests/test_gate6a_transactional_purge_executor.py
          git commit -m "fix(gate6a): bind frozen identity to purge intent"
          git push origin HEAD:ops/gate6a-b7-green-helper
