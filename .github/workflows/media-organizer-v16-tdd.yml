name: Semantic Media Organizer V1.6 TDD

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/batch/media_organizer_*.py'
      - 'app/media_organizer/**'
      - 'app/main.py'
      - 'app/tasks/handlers.py'
      - 'frontend/src/pages/Batch/index.tsx'
      - 'frontend/src/pages/Batch/SemanticMediaOrganizerEditor.tsx'
      - 'frontend/src/api/media_organizer.ts'
      - 'frontend/tests/media_organizer_preview.test.ts'
      - 'tests/test_media_organizer_*.py'
      - '.github/workflows/media-organizer-v16-tdd.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-media-tdd-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONFIG_DIR: /tmp/nfc-config
      DATA_MOUNT: /tmp/nfc-data
      ALLOWED_ROOTS: /tmp/nfc-data
      QUARANTINE_ROOT: /tmp/nfc-data/.nas-file-center-trash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Safe read-only planner and manifest TDD
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_media_organizer_*.py
  frontend-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Read-only preview UI behavior contracts
        working-directory: frontend
        run: node --test tests/media_organizer_preview.test.ts
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
