name: Semantic Media Organizer V1.6 TDD

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'compose*.yaml'
      - 'app/batch/media_organizer_*.py'
      - 'app/media_organizer/**'
      - 'app/config.py'
      - 'app/worker.py'
      - 'app/tasks/media_mutation_lock.py'
      - 'app/tasks/recovery.py'
      - 'app/archive_recovery/**'
      - 'app/quarantine/service_adapter.py'
      - 'app/api/router.py'
      - 'app/service.py'
      - 'app/tasks/handlers_base.py'
      - 'app/tasks/service.py'
      - 'tests/test_archive_recovery_*.py'
      - 'scripts/test_v16_shared_secret_tmpfs_docker.sh'
      - 'scripts/test_v16_media_bind_mount_boundary.sh'
      - 'scripts/test_v16_preview_cross_uid.sh'
      - 'scripts/test_v16_cleanup_cross_uid.sh'
      - 'scripts/validate_v16_fresh_install_compose.sh'
      - 'scripts/run_v16_real_nas_acceptance.sh'
      - 'tests/test_deployment_consistency.py'
      - 'scripts/media_organizer_cross_uid_lifecycle.py'
      - 'tests/test_api_route_media_mutation_boundary.py'
      - 'tests/test_quarantine_*.py'
      - 'app/main.py'
      - 'app/tasks/handlers.py'
      - 'frontend/src/pages/Batch/index.tsx'
      - 'frontend/src/pages/Batch/SemanticMediaOrganizerEditor.tsx'
      - 'frontend/src/api/media_organizer.ts'
      - 'frontend/src/components/tasks/TaskDetailDrawer.tsx'
      - 'frontend/tests/media_organizer_preview.test.ts'
      - 'frontend/tests/media_organizer_cleanup.test.ts'
      - 'frontend/tests/media_organizer_resume.test.tsx'
      - 'frontend/tests/media_organizer_maintenance.test.tsx'
      - 'frontend/scripts/run-tests.mjs'
      - 'frontend/tests/quarantine_worker_mutation.test.ts'
      - 'tests/test_media_organizer_*.py'
      - 'tests/test_media_mutation_lock.py'
      - 'tests/test_maintenance_api_probe_boundary.py'
      - 'scripts/v16_nas_maintenance_acceptance.py'
      - 'tests/test_v16_nas_maintenance_acceptance.py'
      - 'tests/test_deployment_consistency.py'
      - '.github/workflows/media-organizer-v16-tdd.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-media-tdd-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONFIG_DIR: /tmp/nfc-config
      DATA_MOUNT: /tmp/nfc-data
      ALLOWED_ROOTS: /tmp/nfc-data
      QUARANTINE_ROOT: /tmp/nfc-data/.nas-file-center-trash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Safe read-only planner and manifest TDD
        env:
          PYTHONPATH: .
        run: |
          pytest -q tests/test_media_organizer_*.py \
            tests/test_media_mutation_lock.py \
            tests/test_maintenance_api_probe_boundary.py \
            tests/test_v16_nas_maintenance_acceptance.py \
            tests/test_api_route_media_mutation_boundary.py \
            tests/test_archive_recovery_password_channel_preflight.py \
            tests/test_archive_recovery_shared_password_channel.py \
            tests/test_quarantine_api.py \
            tests/test_quarantine_terminal_record_cleanup.py \
            tests/test_archive_recovery_7z_regression.py -k 'not real_7zip_default_header'
      - name: Cross-UID Docker RAM handoff, no NAS (synthetic)
        shell: bash
        run: bash scripts/test_v16_shared_secret_tmpfs_docker.sh
      - name: API read-only / Worker non-root writable Docker boundary (synthetic)
        shell: bash
        run: bash scripts/test_v16_media_bind_mount_boundary.sh
      - name: Real distinct-UID semantic preview and SQLite handoff (synthetic)
        shell: bash
        run: bash scripts/test_v16_preview_cross_uid.sh
      - name: Real distinct-UID execution, cleanup and explicit recovery (synthetic)
        shell: bash
        run: bash scripts/test_v16_cleanup_cross_uid.sh
      - name: Validate isolated fresh V1.6 Compose model (synthetic)
        shell: bash
        run: bash scripts/validate_v16_fresh_install_compose.sh
      - name: Validate real-NAS harness pulls published digest without local build
        shell: bash
        run: pytest -q tests/test_deployment_consistency.py
  frontend-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Preview and confirmed cleanup UI behavior contracts
        working-directory: frontend
        run: |
          ./node_modules/.bin/tsc --outDir /tmp/nfc-media-ui-tests \
            --module commonjs --target es2022 --moduleResolution node --esModuleInterop \
            --skipLibCheck --jsx react-jsx tests/media_organizer_preview.test.ts \
            tests/media_organizer_cleanup.test.ts tests/media_organizer_resume.test.tsx \
            tests/quarantine_worker_mutation.test.ts
          NODE_PATH="$PWD/node_modules" node --test /tmp/nfc-media-ui-tests/tests/*.test.js
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
