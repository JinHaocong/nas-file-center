name: Gate6-B Task4 Freeze Patch
# Activation push: workflow already exists before this commit.

on:
  push:
    branches:
      - v0.3.6-gate6b-utility-recursive-dirbal

permissions:
  contents: write

jobs:
  apply-exact-service-patch:
    if: "${{ github.event.head_commit.message == 'chore(gate6b): apply task4 freeze patch' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact Task4 freeze patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/service.py")
          source = path.read_text(encoding="utf-8")

          old = (
              '            upd: dict[str, Any] = {}\n'
              '\n'
              '            if plan_kind in {"quarantine-bulk-restore", "quarantine-bulk-purge"}:\n'
          )
          new = (
              '            upd: dict[str, Any] = {}\n'
              '\n'
              '            if (\n'
              '                plan_metadata.get("selection_mode") == "recursive_directory_balanced_by_bytes"\n'
              '                and it["operation"] == "quarantine"\n'
              '            ):\n'
              '                from app.planning.recursive_protection_authority import (\n'
              '                    RecursiveProtectionAuthorityError,\n'
              '                    build_frozen_recursive_protection,\n'
              '                )\n'
              '\n'
              '                try:\n'
              '                    frozen_recursive_protection = build_frozen_recursive_protection(\n'
              '                        it["metadata_json"] or "{}",\n'
              '                        expected_source_path=it["source_path"],\n'
              '                        allowed_roots=self.settings.allowed_roots,\n'
              '                        quarantine_root=self.settings.quarantine_root,\n'
              '                    )\n'
              '                except RecursiveProtectionAuthorityError as exc:\n'
              '                    raise StateConflictError(str(exc)) from exc\n'
              '\n'
              '                if frozen_recursive_protection is None:\n'
              '                    raise StateConflictError(\n'
              '                        "RECURSIVE_PROTECTION_AUTHORITY_MISSING: "\n'
              '                        "recursive dedupe quarantine item has no recursive_protection authority"\n'
              '                    )\n'
              '\n'
              '                recursive_meta = json.loads(it["metadata_json"] or "{}")\n'
              '                recursive_meta["frozen_recursive_protection"] = frozen_recursive_protection\n'
              '                it["metadata_json"] = json.dumps(\n'
              '                    recursive_meta,\n'
              '                    ensure_ascii=False,\n'
              '                    sort_keys=True,\n'
              '                )\n'
              '\n'
              '            if plan_kind in {"quarantine-bulk-restore", "quarantine-bulk-purge"}:\n'
          )

          count = source.count(old)
          if count != 1:
              raise SystemExit(f"Task4 service.py anchor count must be 1, got {count}")

          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Remove one-time patch workflow
        run: rm .github/workflows/gate6b-task4-freeze-patch.yml

      - name: Commit exact patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/service.py .github/workflows/gate6b-task4-freeze-patch.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "feat(gate6b): seal recursive protection at freeze"
          git push origin HEAD:v0.3.6-gate6b-utility-recursive-dirbal
