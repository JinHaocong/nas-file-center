name: Gate6-A B12 Remediation

on:
  push:
    branches:
      - v0.3.6-gate6a-quarantine-bulk-operations
    paths:
      - ops/gate6a-remediation/apply_b12_reconciliation_audit.py
      - .github/workflows/gate6a-b12-remediation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    env:
      CONFIG_DIR: /tmp/nfc-config
      DATA_MOUNT: /tmp/nfc-data
      ALLOWED_ROOTS: /tmp/nfc-data
      QUARANTINE_ROOT: /tmp/nfc-data/.nas-file-center-trash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply narrow B12 patch
        run: |
          set -euo pipefail
          python -m py_compile ops/gate6a-remediation/apply_b12_reconciliation_audit.py
          python ops/gate6a-remediation/apply_b12_reconciliation_audit.py
          python -m py_compile app/tasks/handlers.py
          git diff --check
      - name: Install tests
        run: python -m pip install -e '.[test]'
      - name: Run B12 audit contract
        run: pytest -q tests/test_gate6a_plan1_b12_reconciliation_audit.py
      - name: Run preserved Gate5-G regressions
        run: |
          pytest -q \
            tests/test_quarantine_api.py \
            tests/test_quarantine_core.py \
            tests/test_quarantine_hardening.py \
            tests/test_gate5g_g7_task11_cleanup_gate.py \
            tests/test_gate5g_g7_task8_restore.py \
            tests/test_gate5g_g7_hotfix2_worker_restore_authority.py \
            tests/test_gate5g_g7_hotfix3_restore_takeover_generation.py \
            tests/test_v0351_zfuse_ctime_stability.py
      - name: Commit only after GREEN
        run: |
          set -euo pipefail
          git config user.name 'gate6a-remediation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/tasks/handlers.py
          git rm ops/gate6a-remediation/apply_b12_reconciliation_audit.py \
            .github/workflows/gate6a-b12-remediation.yml \
            .github/workflows/gate6a-b12-red-check.yml
          git commit -m 'fix(gate6a): audit purge reconciliation outcomes'
          git push origin HEAD:v0.3.6-gate6a-quarantine-bulk-operations
