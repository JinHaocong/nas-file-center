name: Media Sort Large-Root Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/batch/media_sort.py'
      - 'app/batch/media_sort_jobs.py'
      - 'app/batch/media_sort_bulk_plan.py'
      - 'app/execution/executor.py'
      - 'app/tasks/handlers_base.py'
      - 'app/service.py'
      - 'app/api/router.py'
      - 'app/tasks/handlers.py'
      - 'tests/test_media_sort.py'
      - 'tests/test_media_sort_async.py'
      - 'tests/test_media_sort_performance.py'
      - 'benchmarks/media_sort_benchmark.py'
      - '.github/workflows/media-sort-large-roots.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-sort-large-root-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CONFIG_DIR: /tmp/nfc-config
      DATA_MOUNT: /tmp/nfc-data
      ALLOWED_ROOTS: /tmp/nfc-data
      QUARANTINE_ROOT: /tmp/nfc-data/.nas-file-center-trash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run large-root worker and existing media-sort regression
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_media_sort_async.py tests/test_media_sort.py tests/test_media_sort_performance.py
      - name: Run isolated performance benchmark (timing informational)
        env:
          PYTHONPATH: .
        run: |
          python benchmarks/media_sort_benchmark.py --media 80 --nonmedia 400 --directories 4 --json media-sort-perf.json
          {
            echo '### Media sort performance (synthetic tmpfs/CI disk only)'
            echo '```json'
            cat media-sort-perf.json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload performance benchmark JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-sort-perf-${{ github.sha }}
          path: media-sort-perf.json
          if-no-files-found: ignore
          retention-days: 14
