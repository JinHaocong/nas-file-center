name: Gate6-B Exact Candidate Release Evidence

on:
  push:
    branches:
      - evidence/gate6b-fc428886-linux-amd64

permissions:
  contents: read

jobs:
  linux-amd64-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout independently reviewed exact candidate
        uses: actions/checkout@v4
        with:
          ref: fc42888668cb1b60d8502c78bac77f064e7ec66c
          fetch-depth: 1

      - name: Lock exact source identity
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="fc42888668cb1b60d8502c78bac77f064e7ec66c"
          ACTUAL="$(git rev-parse HEAD)"
          test "${ACTUAL}" = "${EXPECTED}"
          {
            echo "gate=Gate6-B"
            echo "review_verdict=PASS"
            echo "independent_review_id=5230014639"
            echo "expected_candidate=${EXPECTED}"
            echo "checked_out_candidate=${ACTUAL}"
            echo "trigger_ref=${GITHUB_REF}"
            echo "trigger_sha=${GITHUB_SHA}"
            echo "build_platform=linux/amd64"
          } | tee gate6b-release-identity.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build exact candidate linux amd64 image locally
        shell: bash
        run: |
          set -euo pipefail
          SHA7="$(git rev-parse --short=7 HEAD)"
          TAG="kerwinjhc/nas-file-center:0.3.6-gate6b-${SHA7}"
          echo "candidate_tag=${TAG}" | tee docker-evidence.txt
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --tag "${TAG}" \
            . 2>&1 | tee docker-build.log
          {
            echo
            echo "# image inspect"
            docker image inspect "${TAG}"
            echo
            echo "# platform"
            docker image inspect --format 'id={{.Id}} os={{.Os}} arch={{.Architecture}} created={{.Created}}' "${TAG}"
          } | tee -a docker-evidence.txt
          test "$(docker image inspect --format '{{.Architecture}}' "${TAG}")" = "amd64"
          test "$(docker image inspect --format '{{.Os}}' "${TAG}")" = "linux"

      - name: Package exact candidate image for isolated NAS acceptance
        shell: bash
        run: |
          set -euo pipefail
          SHA7="$(git rev-parse --short=7 HEAD)"
          TAG="kerwinjhc/nas-file-center:0.3.6-gate6b-${SHA7}"
          OUT="gate6b-fc428886-linux-amd64.tar"
          docker save -o "${OUT}" "${TAG}"
          sha256sum "${OUT}" | tee gate6b-nas-image.sha256
          docker image inspect --format 'image_id={{.Id}} os={{.Os}} arch={{.Architecture}}' "${TAG}" | tee gate6b-nas-image-identity.txt
          {
            echo "candidate=fc42888668cb1b60d8502c78bac77f064e7ec66c"
            echo "independent_review_id=5230014639"
            echo "candidate_tag=${TAG}"
            echo "tar_file=${OUT}"
          } >> gate6b-nas-image-identity.txt

      - name: Upload Gate6-B exact-candidate Docker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate6b-linux-amd64-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            gate6b-release-identity.txt
            docker-build.log
            docker-evidence.txt

      - name: Upload Gate6-B NAS acceptance image artifact
        uses: actions/upload-artifact@v4
        with:
          name: gate6b-nas-image-fc428886-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            gate6b-fc428886-linux-amd64.tar
            gate6b-nas-image.sha256
            gate6b-nas-image-identity.txt
