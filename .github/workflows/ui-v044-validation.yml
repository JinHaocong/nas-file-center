name: UI Validation

on:
  push:
    branches:
      - ui/v0.4.4-audit-polish
      - ui/v0.4.6-*
      - ui/v0.4.7-*
      - ui/v0.4.9-*
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/ui-v044-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-validation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CONFIG_DIR: /tmp/nfc-config
      DATA_MOUNT: /tmp/nfc-data
      ALLOWED_ROOTS: /tmp/nfc-data
      QUARANTINE_ROOT: /tmp/nfc-data/.nas-file-center-trash

    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify candidate identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          git diff --check

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e '.[test]'

      - name: Run full backend regression
        env:
          PYTHONPATH: .
        run: pytest -q

  frontend-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify candidate identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          git diff --check

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # Run the real React/Radix app in Chromium against read-only synthetic API fixtures.
  # This tests computed CSS/stacking at 8 viewports and light/dark/system modes.
  browser-overlay-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify candidate identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install application dependencies
        working-directory: frontend
        run: npm ci

      - name: Install isolated browser runner (without changing lockfile)
        working-directory: frontend
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium

      - name: Build actual frontend
        working-directory: frontend
        run: npm run build

      # Ubuntu runners may omit CJK fonts: screenshots with tofu squares are
      # not trustworthy evidence of Chinese text wrapping, width or spacing.
      - name: Install and verify Chinese screenshot fonts
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match -f '%{family}\n' ':lang=zh-cn' | grep -E 'Noto (Sans|Serif) CJK'

      # Verify theme switching, cross-tab state and blocked browser APIs in the
      # actual unauthenticated React page. All API calls are synthetic/read-only.
      - name: Run read-only Chromium ThemeProvider resilience matrix
        working-directory: frontend
        run: node scripts/browser-theme-resilience.mjs

      # New task-tracking regression runs first, so async fixture failures fail fast.
      - name: Run read-only Chromium Archive Recovery WorkJob continuity matrix
        working-directory: frontend
        run: node scripts/browser-archive-recovery-task-continuity.mjs

      - name: Run read-only Chromium overlay matrix
        working-directory: frontend
        run: node scripts/browser-overlay-smoke.mjs

      - name: Run read-only Chromium Tasks modal and nested Sheet matrix
        working-directory: frontend
        run: node scripts/browser-task-overlays.mjs

      - name: Run read-only Chromium Quarantine/Plan dialog matrix
        working-directory: frontend
        run: node scripts/browser-quarantine-plan-overlays.mjs

      - name: Run read-only Chromium Quarantine Bulk Restore/Purge matrix
        working-directory: frontend
        run: node scripts/browser-quarantine-bulk-overlays.mjs

      - name: Run read-only Chromium Plan lifecycle and Stale Rebuild matrix
        working-directory: frontend
        run: node scripts/browser-plan-lifecycle-overlays.mjs

      - name: Run read-only Chromium Workflow Preview and Draft confirmation matrix
        working-directory: frontend
        run: node scripts/browser-workflow-preview-overlays.mjs

      - name: Run read-only Chromium Organizer Advanced and Dedupe matrix
        working-directory: frontend
        run: node scripts/browser-organizer-dedupe-overlays.mjs

      - name: Run read-only Chromium Dashboard/Plans/Tasks workspace cascade matrix
        working-directory: frontend
        run: node scripts/browser-workspace-cascade.mjs

      - name: Run read-only Chromium Tasks error/filter/pagination matrix
        working-directory: frontend
        run: node scripts/browser-task-ledger-states.mjs

      - name: Run read-only Chromium Indexes state/pagination/dialog matrix
        working-directory: frontend
        run: node scripts/browser-indexes-ledger-states.mjs

      - name: Run read-only Chromium Media complex filter and queue dialog matrix
        working-directory: frontend
        run: node scripts/browser-media-ledger-states.mjs

      - name: Run read-only Chromium Archive Recovery selection invalidation matrix
        working-directory: frontend
        run: node scripts/browser-archive-recovery-selection.mjs

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pure-white-overlays-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            frontend/artifacts/browser-theme-resilience/*.png
            frontend/artifacts/browser-overlay/*.png
            frontend/artifacts/browser-task-overlay/*.png
            frontend/artifacts/browser-quarantine-plan/*.png
            frontend/artifacts/browser-quarantine-bulk/*.png
            frontend/artifacts/browser-plan-lifecycle/*.png
            frontend/artifacts/browser-workflow-preview/*.png
            frontend/artifacts/browser-organizer-dedupe/*.png
            frontend/artifacts/browser-workspace-cascade/*.png
            frontend/artifacts/browser-workspace-cascade/checkbox-keyboard-audit.json
            frontend/artifacts/browser-workspace-cascade/w2-computed-theme-audit.json
            frontend/artifacts/browser-workspace-cascade/painted-ledger-heading-audit.json
            frontend/artifacts/browser-workspace-cascade/metric-hover-painted-contrast-audit.json
            frontend/artifacts/browser-workspace-cascade/live-metric-theme-cascade-audit.json
            frontend/artifacts/browser-workspace-cascade/provider-metric-theme-user-action-audit.json
            frontend/artifacts/browser-workspace-cascade/provider-metric-theme-frame-audit.json
            frontend/artifacts/browser-task-ledger-states/*.png
            frontend/artifacts/browser-indexes-ledger-states/*.png
            frontend/artifacts/browser-media-ledger-states/*.png
            frontend/artifacts/browser-archive-recovery-selection/*.png
            frontend/artifacts/browser-archive-recovery-task-continuity/*.png

  # Every router path with read-only mock APIs, 8 viewports x 4 themes.
  # Captures actual React screenshots and JSON diagnostics, NOT owner sign-off.
  full-route-visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        width: [360, 390, 430, 768, 1024, 1280, 1440, 1920]
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify candidate identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install application dependencies
        working-directory: frontend
        run: npm ci

      - name: Install isolated Chromium test runner
        working-directory: frontend
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium

      - name: Build actual production frontend
        working-directory: frontend
        run: npm run build

      - name: Install and verify Chinese screenshot fonts
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match -f '%{family}\\n' ':lang=zh-cn' | grep -E 'Noto (Sans|Serif) CJK'

      - name: Visit every React route with safe mock data and capture real screenshots
        working-directory: frontend
        env:
          NFC_VISUAL_WIDTH: ${{ matrix.width }}
        run: node scripts/browser-full-route-visual.mjs

      - name: Upload all-route screenshots and per-page defect manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-route-visual-${{ matrix.width }}-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: frontend/artifacts/full-route-visual/${{ matrix.width }}/
