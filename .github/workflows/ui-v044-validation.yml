name: UI Validation

on:
  push:
    branches:
      - ui/v0.4.4-audit-polish
      - ui/v0.4.6-*
      - ui/v0.4.7-*
      - ui/v0.4.9-*
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/ui-v044-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-validation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CONFIG_DIR: /tmp/nfc-config
      DATA_MOUNT: /tmp/nfc-data
      ALLOWED_ROOTS: /tmp/nfc-data
      QUARANTINE_ROOT: /tmp/nfc-data/.nas-file-center-trash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e '.[test]'

      - name: Run full backend regression
        env:
          PYTHONPATH: .
        run: pytest -q

  frontend-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # Run the real React/Radix app in Chromium against read-only synthetic API fixtures.
  # This tests computed CSS/stacking at 8 viewports and light/dark/system modes.
  browser-overlay-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify candidate identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install application dependencies
        working-directory: frontend
        run: npm ci

      - name: Install isolated browser runner (without changing lockfile)
        working-directory: frontend
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium

      - name: Build actual frontend
        working-directory: frontend
        run: npm run build

      - name: Run read-only Chromium overlay matrix
        working-directory: frontend
        run: node scripts/browser-overlay-smoke.mjs

      - name: Run read-only Chromium Tasks modal and nested Sheet matrix
        working-directory: frontend
        run: node scripts/browser-task-overlays.mjs

      - name: Run read-only Chromium Quarantine/Plan dialog matrix
        working-directory: frontend
        run: node scripts/browser-quarantine-plan-overlays.mjs

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pure-white-overlays-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            frontend/artifacts/browser-overlay/*.png
            frontend/artifacts/browser-task-overlay/*.png
            frontend/artifacts/browser-quarantine-plan/*.png
