name: Gate6-D TDD

on:
  push:
    branches:
      - gate6d/media-metadata-integrity
      - gate6d/media-metadata-integrity-*
  pull_request:
    branches:
      - main
    paths:
      - 'app/media/**'
      - 'app/models.py'
      - 'app/db.py'
      - 'app/config.py'
      - 'app/api/router.py'
      - 'app/execution/executor.py'
      - 'app/service.py'
      - 'app/tasks/**'
      - 'tests/test_gate6d_*.py'
      - 'frontend/src/pages/Media/**'
      - 'frontend/src/types/media.ts'
      - 'frontend/src/api/domain.ts'
      - 'frontend/src/router/index.tsx'
      - 'frontend/src/components/Sidebar.tsx'
      - 'frontend/src/components/Header.tsx'
      - 'frontend/tests/gate6d_*.test.ts'
      - 'Dockerfile'
      - 'pyproject.toml'
      - '.github/workflows/gate6d-tdd.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate6d-tdd-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  focused-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CONFIG_DIR: /tmp/nfc-config
      DATA_MOUNT: /tmp/nfc-data
      ALLOWED_ROOTS: /tmp/nfc-data
      QUARANTINE_ROOT: /tmp/nfc-data/.nas-file-center-trash

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install backend test dependencies
        run: python -m pip install -e '.[test]'

      - name: Run Gate6-D focused tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_gate6d_*.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  linux-amd64-media-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and verify media runtime
        shell: bash
        run: |
          set -euo pipefail
          TAG="nas-file-center:gate6d-${GITHUB_SHA::7}"
          docker buildx build --platform linux/amd64 --load --tag "${TAG}" .
          test "$(docker image inspect --format '{{.Architecture}}' "${TAG}")" = "amd64"
          docker run --rm --entrypoint ffprobe "${TAG}" -version
          docker run --rm --entrypoint python "${TAG}" -c "from PIL import Image; print(Image.__version__)"
