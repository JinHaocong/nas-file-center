name: Gate6-A B12 RED Check

on:
  push:
    branches:
      - v0.3.6-gate6a-quarantine-bulk-operations
    paths:
      - .github/workflows/gate6a-b12-red-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b12-red:
    runs-on: ubuntu-latest
    env:
      CONFIG_DIR: /tmp/nfc-config
      DATA_MOUNT: /tmp/nfc-data
      ALLOWED_ROOTS: /tmp/nfc-data
      QUARANTINE_ROOT: /tmp/nfc-data/.nas-file-center-trash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Run B12 audit-contract tests only
        run: pytest -q tests/test_gate6a_plan1_b12_reconciliation_audit.py
