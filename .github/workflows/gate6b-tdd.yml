name: Gate6-B TDD

on:
  push:
    branches:
      - v0.3.6-gate6b-utility-recursive-dirbal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tdd:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CONFIG_DIR: /tmp/nfc-config
      DATA_MOUNT: /tmp/nfc-data
      ALLOWED_ROOTS: /tmp/nfc-data
      QUARANTINE_ROOT: /tmp/nfc-data/.nas-file-center-trash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e '.[test]'

      - name: Run Gate6-B focused backend tests
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          shopt -s nullglob
          gate6b_tests=(tests/test_gate6b_utility_*.py tests/test_gate6b_recursive_dirbal_*.py)
          if ((${#gate6b_tests[@]})); then
            pytest "${gate6b_tests[@]}" -v
          fi

      - name: Run preserved Workflow, Dedupe, and Utility lifecycle regressions
        env:
          PYTHONPATH: .
        run: >-
          pytest
          tests/test_workflow_validation.py
          tests/test_workflow_compiler.py
          tests/test_gate5d_advanced_dedupe_core.py
          tests/test_gate5d_dedupe_preview_compiler.py
          tests/test_gate5d_dedupe_preview_api.py
          tests/test_gate5d_dedupe_generate.py
          tests/test_gate5d_dedupe_generate_api.py
          tests/test_gate5e_e4_discovery.py
          tests/test_gate5e_e4_lifecycle.py
          tests/test_gate5e_e4_hotfix2.py
          tests/test_gate3_stale_plan.py
          -q

      - name: Run full backend regression suite
        env:
          PYTHONPATH: .
        run: pytest -q

  frontend-tdd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build
