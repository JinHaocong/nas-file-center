name: Gate6-A Task1 Remediation Runner

on:
  push:
    branches:
      - v0.3.6-gate6a-quarantine-bulk-operations
    paths:
      - .github/workflows/gate6a-task1-remediation-runner.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: v0.3.6-gate6a-quarantine-bulk-operations
      CONFIG_DIR: /tmp/nfc-config
      DATA_MOUNT: /tmp/nfc-data
      ALLOWED_ROOTS: /tmp/nfc-data
      QUARANTINE_ROOT: /tmp/nfc-data/.nas-file-center-trash
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Extract audited Task 1 patch from ops branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ops/gate6a-9fb3f92-nas-image:refs/remotes/origin/ops/gate6a-9fb3f92-nas-image
          git show origin/ops/gate6a-9fb3f92-nas-image:.github/workflows/gate6a-task1-remediation.yml > /tmp/task1-source.yml
          python - <<'PY'
          from pathlib import Path

          text = Path('/tmp/task1-source.yml').read_text()
          opener = "          python - <<'PY'\n"
          start = text.index(opener) + len(opener)
          end = text.index("\n          PY", start)
          lines = text[start:end].splitlines()
          out: list[str] = []
          in_raw = False
          for raw_line in lines:
              line = raw_line
              if not in_raw and line.startswith('          '):
                  line = line[10:]
              out.append(line)
              if line.count("'''") % 2 == 1:
                  in_raw = not in_raw
          if in_raw:
              raise SystemExit('unterminated raw replacement block')
          Path('/tmp/gate6a-task1-patch.py').write_text('\n'.join(out) + '\n')
          PY
          test -s /tmp/gate6a-task1-patch.py
          python -m py_compile /tmp/gate6a-task1-patch.py
          python /tmp/gate6a-task1-patch.py
          python -m py_compile app/quarantine/purge.py

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e '.[test]'

      - name: Verify Task 1 contract tests
        env:
          PYTHONPATH: .
        run: >-
          pytest
          tests/test_gate6a_transactional_purge_capture_target_race.py
          tests/test_gate6a_transactional_purge_descriptor_destroy.py
          tests/test_gate6a_transactional_purge_destroy.py
          tests/test_gate6a_purge_recovery.py
          tests/test_gate6a_purge_recovery_foreign.py
          -v

      - name: Verify preserved Gate5-G regressions
        env:
          PYTHONPATH: .
        run: >-
          pytest
          tests/test_gate5g_g7_task11_cleanup_gate.py
          tests/test_gate5g_g7_task8_restore.py
          tests/test_gate5g_g7_hotfix2_worker_restore_authority.py
          tests/test_gate5g_g7_hotfix3_restore_takeover_generation.py
          tests/test_v0351_zfuse_ctime_stability.py
          -q

      - name: Commit production patch only after GREEN
        shell: bash
        run: |
          set -euo pipefail
          git diff --check -- app/quarantine/purge.py
          git add app/quarantine/purge.py
          git config user.name "Gate6-A remediation bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(gate6a): eliminate purge pathname destruction races"
          git push origin "HEAD:$TARGET_BRANCH"
