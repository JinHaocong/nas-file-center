name: Gate6-C TDD

on:
  push:
    branches:
      - feature/gate6c-*
  pull_request:
    branches:
      - main
    paths:
      - 'app/quarantine/**'
      - 'app/execution/executor.py'
      - 'app/models.py'
      - 'app/db.py'
      - 'tests/test_gate6c_cross_storage.py'
      - 'compose.cross-storage.yaml'
      - 'compose.komodo.cross-storage.yaml'
      - '.github/workflows/gate6c-tdd.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate6c-tdd-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  gate6c-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONFIG_DIR: /tmp/nfc-config
      DATA_MOUNT: /tmp/nfc-data
      ALLOWED_ROOTS: /tmp/nfc-data
      QUARANTINE_ROOT: /tmp/nfc-data/.nas-file-center-trash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run Gate6-C focused tests
        env:
          PYTHONPATH: .
        run: pytest tests/test_gate6c_cross_storage.py tests/test_execution.py -q

      - name: Validate cross-storage Compose overlays
        env:
          HOST_DATA_DIR: /tmp/nfc-data
          HOST_QUARANTINE_DIR: /tmp/nfc-quarantine
        run: |
          touch .env
          mkdir -p /tmp/nfc-data /tmp/nfc-quarantine
          docker compose -f compose.yaml -f compose.cross-storage.yaml config >/tmp/gate6c-compose.yaml
          docker compose -f compose.komodo.yaml -f compose.komodo.cross-storage.yaml config >/tmp/gate6c-komodo.yaml
          grep -q '/quarantine/.nas-file-center-trash' /tmp/gate6c-compose.yaml
          grep -q '/quarantine/.nas-file-center-trash' /tmp/gate6c-komodo.yaml

  backend-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CONFIG_DIR: /tmp/nfc-config
      DATA_MOUNT: /tmp/nfc-data
      ALLOWED_ROOTS: /tmp/nfc-data
      QUARANTINE_ROOT: /tmp/nfc-data/.nas-file-center-trash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run full backend regression
        env:
          PYTHONPATH: .
        run: pytest --disable-warnings -q
