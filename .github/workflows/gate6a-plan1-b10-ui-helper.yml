name: Gate6-A Plan1 B10 UI Helper

on:
  push:
    branches:
      - v0.3.6-gate6a-plan1-b10-ui-helper

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Observe B10 UI RED
        working-directory: frontend
        run: |
          set +e
          npm test > /tmp/b10-ui-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/b10-ui-red.log
          if [ "$rc" -eq 0 ]; then
            echo "Expected B10 UI regression test to fail before production patch"
            exit 1
          fi
          grep -Eq "批量永久删除在 v0\.3\.6 已暂缓|hard-link ownership|硬链接所有权|disabled" /tmp/b10-ui-red.log

      - name: Apply exact B10 UI patch
        run: python ops/gate6a-plan1/apply_b10_ui.py

      - name: Diff gate
        run: git diff --check

      - name: Observe B10 UI GREEN
        working-directory: frontend
        run: npm test

      - name: Commit only after RED then GREEN
        run: |
          git config user.name "gate6a-remediation-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm ops/gate6a-plan1/apply_b10_ui.py .github/workflows/gate6a-plan1-b10-ui-helper.yml
          git add frontend/src/pages/Quarantine/index.tsx frontend/tests/gate6a_quarantine_bulk_ui_wiring.test.ts
          git diff --cached --check
          git commit -m "fix(gate6a): disable deferred bulk purge UI"
          git push origin HEAD:v0.3.6-gate6a-plan1-b10-ui-helper
