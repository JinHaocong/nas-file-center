name: Gate6-A Plan1 Test Migration

on:
  push:
    branches:
      - v0.3.6-gate6a-quarantine-bulk-operations
    paths:
      - ops/gate6a-remediation/migrate_plan1_tests.py
      - .github/workflows/gate6a-plan1-test-migration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    env:
      CONFIG_DIR: /tmp/nfc-config
      DATA_MOUNT: /tmp/nfc-data
      ALLOWED_ROOTS: /tmp/nfc-data
      QUARANTINE_ROOT: /tmp/nfc-data/.nas-file-center-trash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply test-only scope migration
        run: |
          set -euo pipefail
          python -m py_compile ops/gate6a-remediation/migrate_plan1_tests.py
          python ops/gate6a-remediation/migrate_plan1_tests.py
          python -m compileall -q tests
          git diff --check
      - name: Install tests
        run: python -m pip install -e '.[test]'
      - name: Run preserved Gate5-G
        run: |
          pytest -q \
            tests/test_quarantine_api.py \
            tests/test_quarantine_core.py \
            tests/test_quarantine_hardening.py \
            tests/test_gate5g_g7_task11_cleanup_gate.py \
            tests/test_gate5g_g7_task8_restore.py \
            tests/test_gate5g_g7_hotfix2_worker_restore_authority.py \
            tests/test_gate5g_g7_hotfix3_restore_takeover_generation.py \
            tests/test_v0351_zfuse_ctime_stability.py
      - name: Run full Gate6-A focused backend
        run: pytest -q tests/test_gate6a_bulk_*.py tests/test_gate6a_transactional_purge*.py tests/test_gate6a_purge_recovery*.py
      - name: Commit migrated tests only after GREEN
        run: |
          set -euo pipefail
          git config user.name 'gate6a-remediation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tests
          git rm ops/gate6a-remediation/migrate_plan1_tests.py .github/workflows/gate6a-plan1-test-migration.yml
          git commit -m 'test(gate6a): align suite with deferred COMPAT purge scope'
          git push origin HEAD:v0.3.6-gate6a-quarantine-bulk-operations
