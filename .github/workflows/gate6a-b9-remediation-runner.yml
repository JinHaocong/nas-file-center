name: Gate6-A B9 Remediation Runner

on:
  push:
    branches:
      - v0.3.6-gate6a-quarantine-bulk-operations
    paths:
      - scripts/gate6a_b9_patch.py
      - .github/workflows/gate6a-b9-remediation-runner.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONFIG_DIR: /tmp/nfc-config
      DATA_MOUNT: /tmp/nfc-data
      ALLOWED_ROOTS: /tmp/nfc-data
      QUARANTINE_ROOT: /tmp/nfc-data/.nas-file-center-trash
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.3.6-gate6a-quarantine-bulk-operations
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply exact B9 durability patch
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/gate6a_b9_patch.py
          python scripts/gate6a_b9_patch.py
          python -m py_compile app/quarantine/purge.py
          git diff --check

      - name: Install tests
        run: python -m pip install -e '.[test]'

      - name: Verify B9 and destructive recovery regressions
        run: >-
          pytest
          tests/test_gate6a_purge_recovery.py
          tests/test_gate6a_purge_recovery_foreign.py
          tests/test_gate6a_purge_recovery_historical_audit.py
          tests/test_gate6a_purge_recovery_preintent.py
          tests/test_gate6a_purge_recovery_restart.py
          tests/test_gate6a_purge_recovery_terminal_commit.py
          tests/test_gate6a_transactional_purge_b7_frozen_identity_intent_race.py
          tests/test_gate6a_transactional_purge_destroy.py
          tests/test_gate6a_transactional_purge_descriptor_destroy.py
          tests/test_gate6a_transactional_purge_capture_fencing.py
          tests/test_gate5g_g7_task11_cleanup_gate.py
          tests/test_gate5g_g7_task8_restore.py
          tests/test_gate5g_g7_hotfix2_worker_restore_authority.py
          tests/test_gate5g_g7_hotfix3_restore_takeover_generation.py
          tests/test_v0351_zfuse_ctime_stability.py
          -v

      - name: Commit production patch only after GREEN
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/gate6a_b9_patch.py
          git rm .github/workflows/gate6a-b9-remediation-runner.yml
          git diff --check
          git config user.name "gate6a-remediation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/quarantine/purge.py
          git commit -m "fix(gate6a): require durable purge tombstone fsync"
          git push origin HEAD:v0.3.6-gate6a-quarantine-bulk-operations
