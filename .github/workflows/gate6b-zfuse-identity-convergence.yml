name: Gate6-B zfuse Identity Convergence

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: gate6b-zfuse-identity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CONFIG_DIR: /tmp/nfc-config
      DATA_MOUNT: /tmp/nfc-data
      ALLOWED_ROOTS: /tmp/nfc-data
      QUARANTINE_ROOT: /tmp/nfc-data/.nas-file-center-trash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Focused Gate6-B identity convergence
        run: >
          pytest
          tests/test_gate6b_zfuse_identity_convergence.py
          tests/test_gate6b_utility_generate.py
          tests/test_gate6b_utility_execution_safety.py
          tests/test_gate6b_utility_structural_cleanup_recovery.py
          tests/test_zfuse_safe_move_v2.py
          -v
      - name: Full backend regression
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Frontend regression
        run: npm test
        working-directory: frontend
      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend
      - name: Production build
        run: npm run build
        working-directory: frontend
