name: Utility Single Regular File Hotfix TDD

on:
  push:
    branches:
      - hotfix/utility-single-regular-file
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONFIG_DIR: /tmp/nfc-config
      DATA_MOUNT: /tmp/nfc-data
      ALLOWED_ROOTS: /tmp/nfc-data
      QUARANTINE_ROOT: /tmp/nfc-data/.nas-file-center-trash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend + test dependencies
        run: python -m pip install -e '.[test]'
      - name: Backend dependency consistency
        run: python -m pip check
      - name: Full backend regression
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend regression
        working-directory: frontend
        run: npm test
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Build release-equivalent Docker image
        run: docker build -t nfc-utility-regular-file-hotfix:test .
      - name: Inspect Docker image
        run: docker image inspect nfc-utility-regular-file-hotfix:test --format '{{json .Config.Labels}}'
