name: zfuse Safe MOVE TDD

on:
  push:
    branches:
      - hotfix/zfuse-safe-move
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: zfuse-safe-move-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CONFIG_DIR: /tmp/nfc-config
      DATA_MOUNT: /tmp/nfc-data
      ALLOWED_ROOTS: /tmp/nfc-data
      QUARANTINE_ROOT: /tmp/nfc-data/.nas-file-center-trash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Focused zfuse safe-MOVE contracts
        run: pytest tests/test_zfuse_safe_move_compat.py tests/test_gate6b_utility_fs_capability.py tests/test_gate6b_utility_discovery.py tests/test_gate6b_utility_execution_safety.py -v
      - name: Full backend regression
        run: pytest -q
