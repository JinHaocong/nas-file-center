name: Gate6-A B4 Remediation Runner

on:
  push:
    branches:
      - v0.3.6-gate6a-quarantine-bulk-operations
    paths:
      - .github/workflows/gate6a-b3-remediation-runner.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: v0.3.6-gate6a-quarantine-bulk-operations
      CONFIG_DIR: /tmp/nfc-config
      DATA_MOUNT: /tmp/nfc-data
      ALLOWED_ROOTS: /tmp/nfc-data
      QUARANTINE_ROOT: /tmp/nfc-data/.nas-file-center-trash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Apply minimal B4 reconciliation patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('app/tasks/handlers.py')
          s = p.read_text()
          marker = '    elif item.operation == "restore":\n'
          if s.count(marker) != 1:
              raise SystemExit(f'expected one restore reconcile branch, found {s.count(marker)}')
          block = base64.b64decode('').decode()
          p.write_text(s.replace(marker, block + marker, 1))
          PY
          python -m py_compile app/tasks/handlers.py
          git diff --check -- app/tasks/handlers.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: python -m pip install -e '.[test]'

      - name: Verify B4 GREEN
        env:
          PYTHONPATH: .
        run: >-
          pytest
          tests/test_gate6a_purge_recovery_terminal_commit.py
          tests/test_gate6a_bulk_purge_audit.py
          -v

      - name: Commit only after GREEN
        shell: bash
        run: |
          set -euo pipefail
          git add app/tasks/handlers.py
          git config user.name "Gate6-A remediation bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(gate6a): reconcile terminal purge worker truth"
          git push origin "HEAD:$TARGET_BRANCH"
