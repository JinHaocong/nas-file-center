name: v0.4.0 Dependency Lock Refresh

on:
  push:
    branches:
      - v0.4.0-release-closure
    paths:
      - frontend/package.json
      - frontend/vite.config.ts

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Refresh lockfile from package.json
        working-directory: frontend
        run: npm install --package-lock-only
      - name: Install exact refreshed dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend regression
        working-directory: frontend
        run: npm test
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Runtime dependency audit must be clean
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=low
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
            exit 0
          fi
          git commit -m "chore: refresh frontend lockfile for v0.4.0"
          git push origin HEAD:v0.4.0-release-closure
