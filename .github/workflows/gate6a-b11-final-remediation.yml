name: Gate6-A B11 Final Remediation

on:
  push:
    branches:
      - v0.3.6-gate6a-quarantine-bulk-operations
    paths:
      - tools/gate6a_b11_final_patch.py
      - .github/workflows/gate6a-b11-final-remediation.yml

permissions:
  contents: write

jobs:
  remediate-b11:
    runs-on: ubuntu-24.04
    env:
      CONFIG_DIR: /tmp/nfc-config
      DATA_MOUNT: /tmp/nfc-data
      ALLOWED_ROOTS: /tmp/nfc-data
      QUARANTINE_ROOT: /tmp/nfc-data/.nas-file-center-trash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e '.[test]'

      - name: Apply exact B11 production patch
        run: |
          python tools/gate6a_b11_final_patch.py
          python -m py_compile app/quarantine/purge.py
          git diff --check

      - name: Verify B11 RED tests are GREEN
        run: |
          pytest \
            tests/test_gate6a_purge_recovery_generation_gap.py \
            tests/test_gate6a_plan1_b11_generation_recovery.py \
            tests/test_gate6a_transactional_purge.py \
            tests/test_gate6a_purge_recovery.py \
            -q

      - name: Verify preserved Gate5-G regressions
        run: |
          pytest \
            tests/test_quarantine_api.py \
            tests/test_quarantine_core.py \
            tests/test_quarantine_hardening.py \
            tests/test_gate5g_g7_task11_cleanup_gate.py \
            tests/test_gate5g_g7_task8_restore.py \
            tests/test_gate5g_g7_hotfix2_worker_restore_authority.py \
            tests/test_gate5g_g7_hotfix3_restore_takeover_generation.py \
            tests/test_v0351_zfuse_ctime_stability.py \
            -q

      - name: Commit verified B11 fix and remove temporary runner
        run: |
          rm tools/gate6a_b11_final_patch.py
          rm .github/workflows/gate6a-b11-final-remediation.yml
          git add app/quarantine/purge.py tools/gate6a_b11_final_patch.py .github/workflows/gate6a-b11-final-remediation.yml
          git diff --cached --check
          git config user.name 'gate6a-remediation-bot'
          git config user.email 'gate6a-remediation-bot@users.noreply.github.com'
          git commit -m 'fix(gate6a): recover durable purge generation without advancing'
          git push origin HEAD:v0.3.6-gate6a-quarantine-bulk-operations
