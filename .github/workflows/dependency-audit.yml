name: Dependency Audit

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # Weekly: detect newly disclosed vulnerabilities even without code changes.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  production-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record candidate identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          echo "Git SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          git diff --check

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies without lifecycle scripts
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Reject moderate or higher production dependency advisories
        working-directory: frontend
        run: node scripts/run-production-dependency-audit.mjs
