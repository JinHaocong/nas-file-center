name: Fclones Progress Hotfix TDD

on:
  push:
    branches:
      - hotfix/fclones-progress-total-regression

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CONFIG_DIR: /tmp/nfc-config
      DATA_MOUNT: /tmp/nfc-data
      ALLOWED_ROOTS: /tmp/nfc-data
      QUARANTINE_ROOT: /tmp/nfc-data/.nas-file-center-trash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply minimal fclones progress fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("app/tasks/handlers_base.py")
          text = path.read_text(encoding="utf-8")
          marker = 'progress_message=f"Importing duplicate groups ({total_groups} found)...",'
          marker_pos = text.find(marker)
          if marker_pos == -1:
              raise SystemExit("fclones import progress marker not found")
          before = text[:marker_pos]
          old_pos = before.rfind("progress_total=0,")
          new_pos = before.rfind("progress_total=None,")
          if old_pos != -1 and marker_pos - old_pos < 160:
              text = text[:old_pos] + "progress_total=None," + text[old_pos + len("progress_total=0,"):]
              path.write_text(text, encoding="utf-8")
          elif new_pos != -1 and marker_pos - new_pos < 160:
              print("minimal fix already present")
          else:
              raise SystemExit("nearby fclones import progress_total sentinel not found")
          PY
          git diff --check
          git diff -- app/tasks/handlers_base.py

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install backend test dependencies
        run: python -m pip install -e '.[test]'

      - name: Run fclones progress regression
        env:
          PYTHONPATH: .
        run: pytest tests/test_fclones_progress_regression.py -q

      - name: Run full backend regression suite
        env:
          PYTHONPATH: .
        run: pytest -q

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Commit verified production fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app/tasks/handlers_base.py; then
            echo "production_fix_already_committed=YES"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/tasks/handlers_base.py
          git commit -m "fix: preserve unknown fclones import total"
          git push origin HEAD:hotfix/fclones-progress-total-regression
