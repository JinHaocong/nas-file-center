name: Fclones Progress Hotfix TDD

on:
  push:
    branches:
      - hotfix/fclones-progress-total-regression

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CONFIG_DIR: /tmp/nfc-config
      DATA_MOUNT: /tmp/nfc-data
      ALLOWED_ROOTS: /tmp/nfc-data
      QUARANTINE_ROOT: /tmp/nfc-data/.nas-file-center-trash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e '.[test]'

      - name: Run fclones progress regression
        env:
          PYTHONPATH: .
        run: pytest tests/test_fclones_progress_regression.py -q

      - name: Run full backend regression suite
        env:
          PYTHONPATH: .
        run: pytest -q
