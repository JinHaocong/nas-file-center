name: zfuse Safe MOVE v2 TDD

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: zfuse-safe-move-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CONFIG_DIR: /tmp/nfc-config
      DATA_MOUNT: /tmp/nfc-data
      ALLOWED_ROOTS: /tmp/nfc-data
      QUARANTINE_ROOT: /tmp/nfc-data/.nas-file-center-trash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Focused safe MOVE v2 contracts
        run: pytest tests/test_zfuse_safe_move_v2.py tests/test_zfuse_safe_move_compat.py tests/test_gate6b_utility_discovery.py tests/test_gate6b_utility_execution_safety.py -v
      - name: Full backend regression
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
