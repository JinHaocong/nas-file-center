name: Gate6-A TDD

on:
  push:
    branches:
      - v0.3.6-gate6a-quarantine-bulk-operations
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend-tdd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONFIG_DIR: /tmp/nfc-config
      DATA_MOUNT: /tmp/nfc-data
      ALLOWED_ROOTS: /tmp/nfc-data
      QUARANTINE_ROOT: /tmp/nfc-data/.nas-file-center-trash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e '.[test]'

      - name: Apply Gate6-A bulk lifecycle hook
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/service.py")
          text = path.read_text()

          first_old = '''            if plan.status != "draft":
              raise ValueError(f"Only draft plans can be frozen, current status={plan.status}")

            items_data = [
'''
          first_new = '''            if plan.status != "draft":
              raise ValueError(f"Only draft plans can be frozen, current status={plan.status}")
            plan_kind = plan.kind

            items_data = [
'''

          second_old = '''            upd: dict[str, Any] = {}

            if it["operation"] == "rmdir_empty":
'''
          second_new = '''            upd: dict[str, Any] = {}

            if plan_kind in {"quarantine-bulk-restore", "quarantine-bulk-purge"}:
              from app.quarantine.bulk_lifecycle import freeze_bulk_plan_item
              bulk_update = freeze_bulk_plan_item(self, plan_kind=plan_kind, item=it)
              if bulk_update is not None:
                item_updates[item_id] = bulk_update
                continue

            if it["operation"] == "rmdir_empty":
'''

          if text.count(first_old) != 1:
              raise SystemExit(f"unexpected first hook match count: {text.count(first_old)}")
          if text.count(second_old) != 1:
              raise SystemExit(f"unexpected second hook match count: {text.count(second_old)}")

          text = text.replace(first_old, first_new, 1).replace(second_old, second_new, 1)
          path.write_text(text)
          PY

      - name: Run preserved quarantine and Gate5-G regressions
        env:
          PYTHONPATH: .
        run: >-
          pytest
          tests/test_quarantine_api.py
          tests/test_quarantine_core.py
          tests/test_quarantine_hardening.py
          tests/test_gate5g_g7_task11_cleanup_gate.py
          tests/test_gate5g_g7_task8_restore.py
          tests/test_v0351_zfuse_ctime_stability.py
          -q

      - name: Run current Gate6-A focused tests
        env:
          PYTHONPATH: .
        run: >-
          pytest
          tests/test_gate6a_bulk_preview*.py
          tests/test_gate6a_bulk_restore.py
          -v

      - name: Commit Gate6-A lifecycle hook
        if: success()
        run: |
          if git diff --quiet -- app/service.py; then
            exit 0
          fi
          git config user.name "Kerwin"
          git config user.email "100753463+JinHaocong@users.noreply.github.com"
          git add app/service.py
          git commit -m "feat(gate6a): wire bulk lifecycle into freeze"
          git push origin HEAD:v0.3.6-gate6a-quarantine-bulk-operations
