name: Gate6-A TDD

on:
  push:
    branches:
      - v0.3.6-gate6a-quarantine-bulk-operations
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend-tdd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONFIG_DIR: /tmp/nfc-config
      DATA_MOUNT: /tmp/nfc-data
      ALLOWED_ROOTS: /tmp/nfc-data
      QUARANTINE_ROOT: /tmp/nfc-data/.nas-file-center-trash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e '.[test]'

      - name: Apply Gate6-A bulk validate hook
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("app/service.py")
          text = path.read_text()

          first_old = '            was_already_stale = (plan.status == "stale")\n            rows = list(session.scalars(select(BatchPlanItem).where(BatchPlanItem.plan_id == plan_id).order_by(BatchPlanItem.sequence)))\n'
          first_new = '            was_already_stale = (plan.status == "stale")\n            plan_kind = plan.kind\n            rows = list(session.scalars(select(BatchPlanItem).where(BatchPlanItem.plan_id == plan_id).order_by(BatchPlanItem.sequence)))\n'

          second_old = '        for row in rows:\n            if row.state == "completed":\n                continue\n\n            if row.operation == "restore":\n'
          second_new = '''        for row in rows:
            if row.state == "completed":
                continue

            if plan_kind in {"quarantine-bulk-restore", "quarantine-bulk-purge"}:
                from app.quarantine.bulk_lifecycle import validate_bulk_plan_item
                bulk_validation = validate_bulk_plan_item(self, plan_kind=plan_kind, item=row)
                if bulk_validation is not None:
                    bulk_state = str(bulk_validation["state"])
                    bulk_reason = str(bulk_validation["reason"])
                    if bulk_state == "stale":
                        stale_detail = StaleItemDetail(
                            item_id=row.id,
                            source_path=row.source_path,
                            reason=bulk_reason,
                            expected={
                                "device": row.expected_device,
                                "inode": row.expected_inode,
                                "size": row.expected_size,
                                "mtime_ns": row.expected_mtime_ns,
                                "hash": row.expected_hash,
                                "target_path": row.target_path,
                            },
                            actual=bulk_validation.get("actual"),
                        )
                        stale_items.append(stale_detail)
                        item_validations[row.id] = ("stale", bulk_reason, None)
                    else:
                        item_validations[row.id] = ("validated", bulk_reason, None)
                    continue

            if row.operation == "restore":
'''

          if text.count(first_old) != 1:
              raise SystemExit(f"unexpected validate plan-kind hook match count: {text.count(first_old)}")
          if text.count(second_old) != 1:
              raise SystemExit(f"unexpected validate item hook match count: {text.count(second_old)}")

          path.write_text(text.replace(first_old, first_new, 1).replace(second_old, second_new, 1))
          PY

      - name: Run preserved quarantine and Gate5-G regressions
        env:
          PYTHONPATH: .
        run: >-
          pytest
          tests/test_quarantine_api.py
          tests/test_quarantine_core.py
          tests/test_quarantine_hardening.py
          tests/test_gate5g_g7_task11_cleanup_gate.py
          tests/test_gate5g_g7_task8_restore.py
          tests/test_v0351_zfuse_ctime_stability.py
          -q

      - name: Run current Gate6-A focused tests
        env:
          PYTHONPATH: .
        run: >-
          pytest
          tests/test_gate6a_bulk_preview*.py
          tests/test_gate6a_bulk_restore.py
          -v

      - name: Commit Gate6-A validate hook
        if: success()
        run: |
          if git diff --quiet -- app/service.py; then
            exit 0
          fi
          git config user.name "Kerwin"
          git config user.email "100753463+JinHaocong@users.noreply.github.com"
          git add app/service.py
          git commit -m "feat(gate6a): wire bulk lifecycle into validate"
          git push origin HEAD:v0.3.6-gate6a-quarantine-bulk-operations
