name: V1.6.2 simple NAS Root Worker feasibility

on:
  pull_request:
    paths:
      - "scripts/probe_nas_compat_capability.sh"
      - "scripts/v16_nas_maintenance_acceptance.py"
      - "tests/test_v16_nas_maintenance_acceptance.py"
      - "app/nas_compat_worker.py"
      - "app/batch/media_organizer_deferred_selection.py"
      - "app/batch/media_organizer_jobs.py"
      - "app/batch/media_organizer_authority.py"
      - "app/batch/media_organizer_execute_jobs.py"
      - "app/batch/media_organizer_cleanup_jobs.py"
      - "app/batch/media_organizer_publish.py"
      - "app/batch/media_organizer_finalize.py"
      - "app/tasks/media_mutation_lock.py"
      - "app/config.py"
      - "app/config_sharing.py"
      - "app/worker.py"
      - "compose.v162-nas-compat-scratch.yaml"
      - "scripts/test_v162_scratch_compose.sh"
      - "tests/test_nas_compat_root_worker.py"
      - "tests/test_media_organizer_nonroot_worker.py"
      - "tests/test_media_mutation_lock.py"
      - "tests/test_media_organizer_deferred_selection.py"
      - "docs/v162-nas-compat-feasibility.md"
      - ".github/workflows/v162-nas-compat-feasibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-root-worker:
    name: UID 0:GID 10000 with DAC_OVERRIDE on disposable CI fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Root Worker identity and regression tests (no NAS)
        run: |
          python -m pytest -q \
            tests/test_nas_compat_root_worker.py \
            tests/test_media_organizer_nonroot_worker.py \
            tests/test_media_mutation_lock.py \
            tests/test_media_organizer_deferred_selection.py
          # Acceptance-driver option contracts only. The independent V1.6 TDD
          # workflow runs the full API/Worker lifecycle with isolated settings.
          python -m pytest -q tests/test_v16_nas_maintenance_acceptance.py \
            -k "opt_in_root_worker_flags or inspected_root_worker_rejects or root_worker_mode_does_not_change or wrong_image_revision_fails_before"
      - name: Verify shell probe syntax
        run: bash -n scripts/probe_nas_compat_capability.sh
      - name: Compare non-root baseline with direct 0:10000 Root Worker
        run: bash scripts/probe_nas_compat_capability.sh
      - name: Validate isolated two-container Compose without starting containers
        run: bash scripts/test_v162_scratch_compose.sh
