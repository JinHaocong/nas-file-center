name: V1.6.2 isolated NAS DAC feasibility

on:
  pull_request:
    paths:
      - "scripts/probe_nas_compat_capability.sh"
      - "scripts/probe_nas_compat_ambient.py"
      - "app/nas_compat_launcher.py"
      - "app/batch/media_organizer_deferred_selection.py"
      - "app/batch/media_organizer_jobs.py"
      - "app/batch/media_organizer_authority.py"
      - "app/config.py"
      - "tests/test_media_organizer_deferred_selection.py"
      - "frontend/src/pages/Batch/SemanticMediaOrganizerEditor.tsx"
      - "app/worker.py"
      - "tests/test_nas_compat_launcher.py"
      - "docs/v162-nas-compat-feasibility.md"
      - ".github/workflows/v162-nas-compat-feasibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-dac-capability:
    name: Non-root Worker DAC capability on disposable CI fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify probe syntax and isolated test fixture
        run: |
          bash -n scripts/probe_nas_compat_capability.sh
          python3 -m py_compile scripts/probe_nas_compat_ambient.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gate and root-denial unit tests (no media)
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_nas_compat_launcher.py
          # A full dependency install and backend/frontend regression run in
          # the existing V1.6 media organizer workflow for these changes.
      - name: Compare baseline vs DAC override (CI host only)
        run: bash scripts/probe_nas_compat_capability.sh
