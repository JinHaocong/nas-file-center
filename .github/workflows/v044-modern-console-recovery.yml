name: v0.4.4 Modern Console Recovery

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: v044-modern-console-recovery-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Frontend regression
        run: npm test
        working-directory: frontend
      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend
      - name: Production build
        run: npm run build
        working-directory: frontend
