name: V1.6 Real NAS Scratch Acceptance
# Exact-HEAD, isolated SATA-only acceptance; never mounts production media paths.

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/media-organizer-v16-real-nas.yml'
      - 'scripts/media_organizer_v16_real_nas_acceptance.py'
      - 'app/batch/media_organizer_*.py'
      - 'app/batch/media_organizer_fd_link.py'
      - 'app/fs_ops.py'
      - 'tests/test_media_organizer_*.py'

permissions:
  contents: read

concurrency:
  group: media-organizer-v16-real-nas-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  actual-nas-v16-scratch:
    # Only this same-repository PR is allowed to use the dedicated runner.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/media-organizer-v16-sdd-foundation'
    runs-on: [self-hosted, linux, x64, nas-file-center-acceptance]
    timeout-minutes: 60
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      NAS_DATA_ROOT: /tmp/zfsv3/sata11/15246330601/data
      ACCEPTANCE_ROOT: /tmp/zfsv3/sata11/15246330601/data/nas-file-center-v1.6-acceptance
      ORGANIZER_ROOT: /tmp/zfsv3/sata11/15246330601/data/nas-file-center-v1.6-acceptance/nfc-organizer-c5-acceptance
      SCHEDULER_ROOT: /tmp/zfsv3/sata11/15246330601/data/nas-file-center-v1.6-acceptance/nfc-scheduler-s5-acceptance

    steps:
      - name: Checkout exact PR candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact candidate and owner-created SATA scratch directories
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test -d "${NAS_DATA_ROOT}"
          test ! -L "${NAS_DATA_ROOT}"
          test -d "${ACCEPTANCE_ROOT}"
          test ! -L "${ACCEPTANCE_ROOT}"
          test "$(realpath -e "${NAS_DATA_ROOT}")" = "${NAS_DATA_ROOT}"
          test "$(realpath -e "${ACCEPTANCE_ROOT}")" = "${ACCEPTANCE_ROOT}"
          test "${ACCEPTANCE_ROOT}" = "${NAS_DATA_ROOT}/nas-file-center-v1.6-acceptance"
          test -d "${ORGANIZER_ROOT}" && test ! -L "${ORGANIZER_ROOT}"
          test -d "${SCHEDULER_ROOT}" && test ! -L "${SCHEDULER_ROOT}"
          test "$(basename "${ORGANIZER_ROOT}")" = "nfc-organizer-c5-acceptance"
          test "$(basename "${SCHEDULER_ROOT}")" = "nfc-scheduler-s5-acceptance"
          test "$(stat -c %d "${NAS_DATA_ROOT}")" = "$(stat -c %d "${ACCEPTANCE_ROOT}")"

          mapfile -t ROOT_CHILDREN < <(find "${ACCEPTANCE_ROOT}" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          test "${#ROOT_CHILDREN[@]}" -eq 2
          test "${ROOT_CHILDREN[0]}" = "nfc-organizer-c5-acceptance"
          test "${ROOT_CHILDREN[1]}" = "nfc-scheduler-s5-acceptance"

          # The Scheduler root is reserved and must remain empty.
          test -z "$(find "${SCHEDULER_ROOT}" -mindepth 1 -maxdepth 1 -print -quit)"
          # Organizer root may contain only prior V1.6 run directories; never
          # auto-delete a previous run or any unknown user-created entry.
          while IFS= read -r entry; do
            test -d "${entry}" && test ! -L "${entry}"
            case "$(basename "${entry}")" in .nfc-v16-run-*) ;; *) echo "Unexpected organizer-root entry: ${entry}"; exit 1;; esac
          done < <(find "${ORGANIZER_ROOT}" -mindepth 1 -maxdepth 1 -print)

          mkdir -p v16-nas-evidence
          {
            echo "candidate_sha=${CANDIDATE_SHA}"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "nas_data_root=${NAS_DATA_ROOT}"
            echo "acceptance_root=${ACCEPTANCE_ROOT}"
            echo "organizer_root=${ORGANIZER_ROOT}"
            echo "scheduler_root=${SCHEDULER_ROOT}"
            echo "filesystem=$(stat -f -c '%T' "${ACCEPTANCE_ROOT}")"
            echo "mount=$(findmnt -T "${ACCEPTANCE_ROOT}" -no SOURCE,FSTYPE,OPTIONS)"
            echo "device=$(stat -c '%d' "${ACCEPTANCE_ROOT}")"
            echo "uid_gid_mode=$(stat -c '%u:%g %a' "${ACCEPTANCE_ROOT}")"
          } | tee v16-nas-evidence/identity.txt

      - name: Build exact PR candidate image
        shell: bash
        run: |
          set -euo pipefail
          TAG="nas-file-center:v16-nas-${CANDIDATE_SHA::12}"
          echo "TAG=${TAG}" >> "${GITHUB_ENV}"
          docker version | tee v16-nas-evidence/docker-version.txt
          docker buildx build --platform linux/amd64 --load --tag "${TAG}" . 2>&1 | tee v16-nas-evidence/docker-build.log
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${TAG}")" = "linux/amd64"

      - name: Run V1.6 capability and synthetic end-to-end checks on SATA
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 \
            -v "${ACCEPTANCE_ROOT}:/nas/v16-acceptance:rw" \
            -v "${PWD}/scripts/media_organizer_v16_real_nas_acceptance.py:/tmp/media_organizer_v16_real_nas_acceptance.py:ro" \
            -v "${PWD}/v16-nas-evidence:/evidence:rw" \
            "${TAG}" \
            python /tmp/media_organizer_v16_real_nas_acceptance.py \
              --root /nas/v16-acceptance \
              --organizer-root /nas/v16-acceptance/nfc-organizer-c5-acceptance \
              --candidate-sha "${CANDIDATE_SHA}" \
              --report /evidence/v16-real-nas-acceptance.json \
            2>&1 | tee v16-nas-evidence/acceptance.log

      - name: Verify only expected V1.6 evidence remains on SATA
        shell: bash
        run: |
          set -euo pipefail
          test -f v16-nas-evidence/v16-real-nas-acceptance.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path("v16-nas-evidence/v16-real-nas-acceptance.json").read_text())
          if report.get("candidate_sha") != os.environ["CANDIDATE_SHA"]:
              raise SystemExit("evidence candidate SHA mismatch")
          if report.get("result") != "PASS_FLAT_AND_GROUP_HOLD":
              raise SystemExit("V1.6 real-NAS scratch acceptance did not pass")
          probe = report.get("filesystem_probe", {})
          for key in ("cleanup_complete", "flat_filesystem_capabilities_compatible",
                      "private_stage_owner_verified", "private_stage_mode_verified",
                      "source_fd_hardlink_noreplace", "source_fd_name_swap_safe"):
              if probe.get(key) is not True:
                  raise SystemExit(f"filesystem capability not proven: {key}")
          if probe.get("grouped_publication_authorized") is not False:
              raise SystemExit("grouped publication must remain disabled")
          if report.get("grouped_flow", {}).get("public_group_created") is not False:
              raise SystemExit("unexpected public group creation")
          if report.get("flat_flow", {}).get("second_scan_zero_change") is not False:
              raise SystemExit("deferred cleanup limitation must be explicit")
          PY

          test -z "$(find "${SCHEDULER_ROOT}" -mindepth 1 -maxdepth 1 -print -quit)"
          # Keep the one uniquely named V1.6 evidence directory for owner review.
          while IFS= read -r entry; do
            test -d "${entry}" && test ! -L "${entry}"
            case "$(basename "${entry}")" in .nfc-v16-run-*) ;; *) echo "Unexpected SATA test artifact: ${entry}"; exit 1;; esac
          done < <(find "${ORGANIZER_ROOT}" -mindepth 1 -maxdepth 1 -print)
          test -n "$(find "${ORGANIZER_ROOT}" -mindepth 1 -maxdepth 1 -print -quit)"

      - name: Upload V1.6 NAS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v16-real-nas-${{ github.event.pull_request.head.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: v16-nas-evidence/

      - name: Remove only the local candidate Docker image
        if: always()
        shell: bash
        run: docker image rm "${TAG:-nas-file-center:v16-nas-${CANDIDATE_SHA::12}}" >/dev/null 2>&1 || true
