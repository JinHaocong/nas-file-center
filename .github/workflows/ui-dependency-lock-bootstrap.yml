name: UI Dependency Lock Bootstrap

on:
  push:
    branches:
      - feat/console-v2-radix-lucide-foundation
    paths:
      - frontend/package.json

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.repository == 'JinHaocong/nas-file-center'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/console-v2-radix-lucide-foundation
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate npm lockfile using registry resolution
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit reproducible lockfile to feature branch only
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore(ui): lock Radix and Lucide dependency graph"
          git push origin HEAD:refs/heads/feat/console-v2-radix-lucide-foundation
