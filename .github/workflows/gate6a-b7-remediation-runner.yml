name: Gate6-A B7 Remediation Runner

on:
  push:
    branches:
      - v0.3.6-gate6a-quarantine-bulk-operations
    paths:
      - .github/workflows/gate6a-b7-remediation-runner.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate-b7:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.3.6-gate6a-quarantine-bulk-operations
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply B7 frozen identity authority patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def sub_once(path: str, pattern: str, replacement: str) -> None:
              p = Path(path)
              text = p.read_text()
              new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: regex expected one match, got {count}: {pattern[:80]}")
              p.write_text(new_text)

          purge_path = Path("app/quarantine/purge.py")
          purge = purge_path.read_text()

          builder = '''def build_purge_topology_manifest(
              entry: Any,
              quarantine_root: Path | str,
              *,
              owner_lookup: Callable[[int], Any | None] | None = None,
          ) -> dict[str, Any]:
              """Build the read-only Gate6-A transactional purge topology manifest."""
              manifest = _build_preview_purge_topology_manifest(
                  entry,
                  quarantine_root,
                  owner_lookup=owner_lookup,
              )
              manifest["frozen_payload_identity"] = {
                  "device": entry.device,
                  "inode": entry.inode,
                  "size": entry.size,
                  "mtime_ns": entry.mtime_ns,
                  "content_hash": str(entry.content_hash or "").lower(),
              }
              return manifest
          '''
          purge, count = re.subn(
              r'def build_purge_topology_manifest\(.*?(?=\n\ndef validate_purge_topology_manifest)',
              builder.rstrip(),
              purge,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"purge.py: builder replacement count={count}")

          helper = '''

          def _require_frozen_payload_identity(
              frozen_manifest: dict[str, Any],
          ) -> tuple[int, int, int, int, str]:
              raw = frozen_manifest.get("frozen_payload_identity")
              if not isinstance(raw, dict):
                  raise StateConflictError("PURGE_FROZEN_IDENTITY_MISSING: frozen payload identity is required")
              required = ("device", "inode", "size", "mtime_ns", "content_hash")
              if any(raw.get(key) is None for key in required):
                  raise StateConflictError("PURGE_FROZEN_IDENTITY_MISSING: frozen payload identity is incomplete")
              try:
                  device = int(raw["device"])
                  inode = int(raw["inode"])
                  size = int(raw["size"])
                  mtime_ns = int(raw["mtime_ns"])
              except (TypeError, ValueError) as exc:
                  raise StateConflictError("PURGE_FROZEN_IDENTITY_MISSING: frozen payload identity is invalid") from exc
              content_hash = str(raw.get("content_hash") or "").lower()
              if not content_hash:
                  raise StateConflictError("PURGE_FROZEN_IDENTITY_MISSING: frozen payload hash is required")
              return device, inode, size, mtime_ns, content_hash
          '''
          marker = "\n\ndef classify_cross_entry_alias_owner("
          if purge.count(marker) != 1:
              raise SystemExit("purge.py: classify marker not unique")
          purge = purge.replace(marker, helper.rstrip() + marker, 1)

          begin_fn = '''def _begin_transactional_purge_intent(
              session_factory: Any,
              entry_id: int,
              worker_id: str,
              frozen_manifest: dict[str, Any] | None = None,
              quarantine_root: Path | str | None = None,
          ) -> None:
              """Commit Gate6-A irreversible purge intent before any filesystem capture syscall."""
              with session_factory() as session:
                  session.execute(text("BEGIN IMMEDIATE"))
                  assert_active_worker_lease(session, worker_id)
                  entry = session.get(QuarantineEntry, entry_id)
                  if entry is None:
                      session.rollback()
                      raise StateConflictError(f"Quarantine entry #{entry_id} not found")
                  if entry.state != "active" or entry.tx_phase != "active":
                      state = entry.state
                      tx_phase = entry.tx_phase
                      session.rollback()
                      raise StateConflictError(
                          f"Quarantine entry #{entry_id} must still be active before purge "
                          f"(state={state}, tx_phase={tx_phase})"
                      )
                  if frozen_manifest is None:
                      session.rollback()
                      raise StateConflictError("PURGE_FROZEN_IDENTITY_MISSING: frozen purge authority is required")
                  expected_identity = _require_frozen_payload_identity(frozen_manifest)
                  current_identity = (
                      int(entry.device or 0),
                      int(entry.inode or 0),
                      int(entry.size or 0),
                      int(entry.mtime_ns or 0),
                      str(entry.content_hash or "").lower(),
                  )
                  if current_identity != expected_identity:
                      session.rollback()
                      raise StateConflictError(
                          f"PURGE_FROZEN_IDENTITY_CHANGED: quarantine entry #{entry_id} identity changed after Freeze"
                      )
                  if quarantine_root is not None:
                      ownership_reason = _intent_time_purge_ownership_reason(
                          session,
                          entry,
                          frozen_manifest,
                          Path(quarantine_root),
                      )
                      if ownership_reason is not None:
                          session.rollback()
                          raise StateConflictError(
                              f"{ownership_reason}: purge ownership changed before irreversible intent "
                              f"for quarantine entry #{entry_id}"
                          )
                  entry.state = "purging"
                  entry.tx_phase = "purging"
                  session.commit()
          '''
          purge, count = re.subn(
              r'def _begin_transactional_purge_intent\(.*?(?=\n\ndef _allocate_transactional_purge_attempt)',
              begin_fn.rstrip(),
              purge,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"purge.py: begin replacement count={count}")

          identity_pattern = (
              r'        generation = int\(entry\.active_attempt_generation or 0\)\n'
              r'        expected_device = entry\.device\n'
              r'        expected_inode = entry\.inode\n'
              r'        expected_size = entry\.size\n'
              r'        expected_mtime_ns = entry\.mtime_ns\n'
              r'        expected_hash = \(entry\.content_hash or ""\)\.lower\(\)\n\n'
              r'    if generation <= 0 or not expected_hash:'
          )
          identity_replacement = '''        generation = int(entry.active_attempt_generation or 0)

              expected_device, expected_inode, expected_size, expected_mtime_ns, expected_hash = (
              _require_frozen_payload_identity(frozen_manifest)
          )

          if generation <= 0:'''
          purge, count = re.subn(identity_pattern, identity_replacement, purge, flags=re.S)
          if count != 2:
              raise SystemExit(f"purge.py: expected two mutable identity reads, got {count}")

          terminal_marker = '        entry.state = "purged"\n'
          if purge.count(terminal_marker) != 1:
              raise SystemExit(f"purge.py: terminal state marker count={purge.count(terminal_marker)}")
          terminal_check = '''        current_identity = (
              int(entry.device or 0),
              int(entry.inode or 0),
              int(entry.size or 0),
              int(entry.mtime_ns or 0),
              str(entry.content_hash or "").lower(),
          )
          if current_identity != (
              expected_device,
              expected_inode,
              expected_size,
              expected_mtime_ns,
              expected_hash,
          ):
              session.rollback()
              raise StateConflictError(
                  f"PURGE_FROZEN_IDENTITY_CHANGED: quarantine entry #{entry_id} identity changed before terminal purge commit"
              )
          '''
          purge = purge.replace(terminal_marker, terminal_check + terminal_marker, 1)
          purge_path.write_text(purge)

          executor_path = Path("app/execution/executor.py")
          executor = executor_path.read_text()
          purge_block = '''    if item.operation == "quarantine_purge":
              if not session_factory or not worker_id or not quarantine_entry_id or purge_manifest is None:
                  return ItemResult(
                      "failed",
                      "EOPNOTSUPP: quarantine purge requires worker authority, session_factory, quarantine_entry_id, and frozen purge manifest",
                  )
              if (
                  item.expected_device is None
                  or item.expected_inode is None
                  or item.expected_size is None
                  or item.expected_mtime_ns is None
                  or not item.expected_hash
              ):
                  return ItemResult(
                      "failed",
                      "PURGE_FROZEN_IDENTITY_MISSING: BatchPlanItem.expected_* is required",
                  )
              frozen_identity = (
                  int(item.expected_device),
                  int(item.expected_inode),
                  int(item.expected_size),
                  int(item.expected_mtime_ns),
                  str(item.expected_hash).lower(),
              )
              frozen_purge_authority = dict(purge_manifest)
              frozen_purge_authority["frozen_payload_identity"] = {
                  "device": frozen_identity[0],
                  "inode": frozen_identity[1],
                  "size": frozen_identity[2],
                  "mtime_ns": frozen_identity[3],
                  "content_hash": frozen_identity[4],
              }

              from app.models import QuarantineEntry

              with session_factory() as session:
                  q_entry = session.get(QuarantineEntry, quarantine_entry_id)
                  if q_entry is None:
                      return ItemResult(
                          "failed",
                          f"PURGE_FROZEN_IDENTITY_CHANGED: quarantine entry #{quarantine_entry_id} no longer exists",
                      )
                  current_identity = (
                      int(q_entry.device or 0),
                      int(q_entry.inode or 0),
                      int(q_entry.size or 0),
                      int(q_entry.mtime_ns or 0),
                      str(q_entry.content_hash or "").lower(),
                  )
                  if current_identity != frozen_identity:
                      return ItemResult(
                          "failed",
                          f"PURGE_FROZEN_IDENTITY_CHANGED: quarantine entry #{quarantine_entry_id} identity changed after Freeze",
                      )
              try:
                  from app.quarantine.purge import (
                      destroy_transactional_purge_capture,
                      execute_transactional_purge_capture,
                  )
                  execute_transactional_purge_capture(
                      session_factory,
                      quarantine_entry_id,
                      worker_id,
                      frozen_purge_authority,
                      quarantine_root,
                      list(allowed_roots),
                  )
                  destroy_transactional_purge_capture(
                      session_factory,
                      quarantine_entry_id,
                      worker_id,
                      frozen_purge_authority,
                      quarantine_root,
                      list(allowed_roots),
                  )
              except Exception as exc:
                  return ItemResult("failed", str(exc))
              return ItemResult("completed", "purged")
          '''
          executor, count = re.subn(
              r'    if item\.operation == "quarantine_purge":\n.*?        return ItemResult\("completed", "purged"\)\n',
              purge_block,
              executor,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"executor.py: purge block replacement count={count}")
          executor_path.write_text(executor)

          test_path = Path("tests/test_gate6a_transactional_purge_executor.py")
          tests = test_path.read_text()
          authorized_old = '        OperationItem(sequence=1, operation="quarantine_purge", source=public_view),\n        allowed_roots=[data],\n        allow_mutation=True,\n        allow_delete=True,\n        quarantine_root=quarantine_root,\n        plan_id="gate6a-purge-authorized",'
          authorized_new = '''        OperationItem(
              sequence=1,
              operation="quarantine_purge",
              source=public_view,
              expected_device=st.st_dev,
              expected_inode=st.st_ino,
              expected_size=st.st_size,
              expected_mtime_ns=st.st_mtime_ns,
              expected_hash=hashlib.sha256(payload).hexdigest(),
          ),
              allowed_roots=[data],
              allow_mutation=True,
              allow_delete=True,
              quarantine_root=quarantine_root,
              plan_id="gate6a-purge-authorized",'''
          if tests.count(authorized_old) != 1:
              raise SystemExit(f"executor tests: authorized pattern count={tests.count(authorized_old)}")
          tests = tests.replace(authorized_old, authorized_new, 1)

          owner_old = '        OperationItem(sequence=1, operation="quarantine_purge", source=public_view),\n        allowed_roots=[data],\n        allow_mutation=True,\n        allow_delete=True,\n        quarantine_root=quarantine_root,\n        plan_id="gate6a-purge-owner-race",'
          owner_new = '''        OperationItem(
              sequence=1,
              operation="quarantine_purge",
              source=public_view,
              expected_device=st.st_dev,
              expected_inode=st.st_ino,
              expected_size=st.st_size,
              expected_mtime_ns=st.st_mtime_ns,
              expected_hash=payload_hash,
          ),
              allowed_roots=[data],
              allow_mutation=True,
              allow_delete=True,
              quarantine_root=quarantine_root,
              plan_id="gate6a-purge-owner-race",'''
          if tests.count(owner_old) != 1:
              raise SystemExit(f"executor tests: owner pattern count={tests.count(owner_old)}")
          test_path.write_text(tests.replace(owner_old, owner_new, 1))
          PY

          python -m py_compile app/execution/executor.py app/quarantine/purge.py
          git diff --check

      - name: Install tests
        run: python -m pip install -e '.[test]'

      - name: Verify B7 and preserved destructive regressions
        run: >-
          pytest
          tests/test_gate6a_transactional_purge_b7_frozen_identity_intent_race.py
          tests/test_gate6a_transactional_purge_executor.py
          tests/test_gate6a_transactional_purge_intent_race.py
          tests/test_gate6a_transactional_purge_capture.py
          tests/test_gate6a_transactional_purge_qualification.py
          tests/test_gate6a_transactional_purge_destroy.py
          tests/test_gate6a_purge_recovery*.py
          tests/test_gate5g_g7_task11_cleanup_gate.py
          tests/test_gate5g_g7_task8_restore.py
          tests/test_gate5g_g7_hotfix2_worker_restore_authority.py
          tests/test_gate5g_g7_hotfix3_restore_takeover_generation.py
          tests/test_v0351_zfuse_ctime_stability.py
          -v

      - name: Commit only after GREEN
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/gate6a-b7-remediation-runner.yml
          git diff --check
          git config user.name "gate6a-remediation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/execution/executor.py app/quarantine/purge.py tests/test_gate6a_transactional_purge_executor.py
          git commit -m "fix(gate6a): bind frozen identity to purge intent"
          git push origin HEAD:v0.3.6-gate6a-quarantine-bulk-operations
