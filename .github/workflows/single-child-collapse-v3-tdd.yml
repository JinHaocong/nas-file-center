name: Single Child Collapse v3 TDD

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: single-child-collapse-v3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CONFIG_DIR: /tmp/nfc-config
      DATA_MOUNT: /tmp/nfc-data
      ALLOWED_ROOTS: /tmp/nfc-data
      QUARANTINE_ROOT: /tmp/nfc-data/.nas-file-center-trash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Focused convergence RED/GREEN
        run: pytest tests/test_single_child_collapse_convergence_v3.py tests/test_zfuse_safe_move_v2.py tests/test_gate6b_utility_generate.py -v
      - name: Full backend regression
        run: pytest -q
