name: Gate6-A B6 Recovery Audit Remediation

on:
  push:
    branches:
      - v0.3.6-gate6a-quarantine-bulk-operations
    paths:
      - .github/workflows/gate6a-b6-remediation-runner.yml

permissions:
  contents: write

jobs:
  remediate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: v0.3.6-gate6a-quarantine-bulk-operations
      CONFIG_DIR: /tmp/nfc-config
      DATA_MOUNT: /tmp/nfc-data
      ALLOWED_ROOTS: /tmp/nfc-data
      QUARANTINE_ROOT: /tmp/nfc-data/.nas-file-center-trash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Apply minimal B6 recovery audit fix
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/apply_b6.py
          python -m py_compile /tmp/apply_b6.py
          python /tmp/apply_b6.py
          python -m py_compile app/tasks/handlers.py
          git diff --check -- app/tasks/handlers.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: python -m pip install -e '.[test]'

      - name: Verify B6 RED-to-GREEN and preserved safety suites
        env:
          PYTHONPATH: .
        run: >-
          pytest
          tests/test_quarantine_api.py
          tests/test_quarantine_core.py
          tests/test_quarantine_hardening.py
          tests/test_gate5g_g7_task11_cleanup_gate.py
          tests/test_gate5g_g7_task8_restore.py
          tests/test_gate5g_g7_hotfix2_worker_restore_authority.py
          tests/test_gate5g_g7_hotfix3_restore_takeover_generation.py
          tests/test_v0351_zfuse_ctime_stability.py
          tests/test_gate6a_bulk_*.py
          tests/test_gate6a_transactional_purge*.py
          tests/test_gate6a_purge_recovery*.py
          -q

      - name: Commit only after GREEN
        shell: bash
        run: |
          set -euo pipefail
          git add app/tasks/handlers.py
          git rm .github/workflows/gate6a-b6-remediation-runner.yml
          git config user.name "Gate6-A remediation bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(gate6a): reconcile historical purge audits after crash"
          git push origin "HEAD:$TARGET_BRANCH"
