name: Gate6-B Task6 Execute Preflight Patch
# Activation push: workflow exists before this commit.

on:
  push:
    branches:
      - v0.3.6-gate6b-utility-recursive-dirbal

permissions:
  contents: write

jobs:
  apply-execute-preflight-patch:
    if: "${{ github.event.head_commit.message == 'chore(gate6b): apply task6 execute preflight patch' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact Worker and direct-execute patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          handlers = Path("app/tasks/handlers_base.py")
          source = handlers.read_text(encoding="utf-8")
          old = (
              '                    break\n'
              '\n'
              '            result = execute_item(\n'
              '                item_op,\n'
          )
          new = (
              '                    break\n'
              '\n'
              '            if item_meta.operation == "quarantine":\n'
              '                try:\n'
              '                    recursive_item_meta = json.loads(item_meta.metadata_json or "{}")\n'
              '                except Exception:\n'
              '                    recursive_item_meta = None\n'
              '                has_recursive_authority = (\n'
              '                    isinstance(recursive_item_meta, dict)\n'
              '                    and (\n'
              '                        "recursive_protection" in recursive_item_meta\n'
              '                        or "frozen_recursive_protection" in recursive_item_meta\n'
              '                    )\n'
              '                )\n'
              '                if (\n'
              '                    plan_meta.get("selection_mode") == "recursive_directory_balanced_by_bytes"\n'
              '                    or has_recursive_authority\n'
              '                ):\n'
              '                    if context.worker_id is not None:\n'
              '                        with context.SessionLocal() as lease_session:\n'
              '                            assert_active_worker_lease(\n'
              '                                lease_session, context.worker_id, now=utcnow()\n'
              '                            )\n'
              '\n'
              '                    from app.planning.recursive_protection_authority import (\n'
              '                        evaluate_live_recursive_protection,\n'
              '                    )\n'
              '\n'
              '                    recursive_evaluation = evaluate_live_recursive_protection(\n'
              '                        item_meta.metadata_json or "{}",\n'
              '                        expected_source_path=item_meta.source_path,\n'
              '                        allowed_roots=settings.allowed_roots,\n'
              '                        quarantine_root=settings.quarantine_root,\n'
              '                    )\n'
              '                    if not recursive_evaluation.safe:\n'
              '                        recursive_reason = (\n'
              '                            recursive_evaluation.reason\n'
              '                            or "RECURSIVE_PROTECTION_UNSTABLE"\n'
              '                        )\n'
              '                        with context.SessionLocal() as session:\n'
              '                            session.execute(text("BEGIN IMMEDIATE"))\n'
              '                            now = utcnow()\n'
              '                            if context.worker_id is not None:\n'
              '                                assert_active_worker_lease(\n'
              '                                    session, context.worker_id, now=now\n'
              '                                )\n'
              '                            row = session.get(BatchPlanItem, item_meta.id)\n'
              '                            if row:\n'
              '                                row.state = "failed"\n'
              '                                row.reason = recursive_reason\n'
              '                            if q_entry_id:\n'
              '                                qe = session.get(QuarantineEntry, q_entry_id)\n'
              '                                if qe:\n'
              '                                    qe.state = "abandoned"\n'
              '                                    qe.last_error = recursive_reason\n'
              '                                    qe.updated_at = now\n'
              '\n'
              '                            plan = session.get(BatchPlan, plan_id)\n'
              '                            items = list(session.scalars(\n'
              '                                select(BatchPlanItem).where(BatchPlanItem.plan_id == plan_id)\n'
              '                            ))\n'
              '                            completed_count = sum(\n'
              '                                1 for it in items if it.state == "completed"\n'
              '                            )\n'
              '                            current_plan_meta = json.loads(plan.metadata_json or "{}")\n'
              '                            exec_meta = current_plan_meta.setdefault("execution", {})\n'
              '                            if completed_count > 0:\n'
              '                                plan.status = "partial"\n'
              '                                exec_meta["termination_reason"] = recursive_reason\n'
              '                            else:\n'
              '                                plan.status = "stale"\n'
              '                            plan.metadata_json = json.dumps(\n'
              '                                current_plan_meta, ensure_ascii=False\n'
              '                            )\n'
              '\n'
              '                            session.add(AuditEvent(\n'
              '                                operation=item_meta.operation,\n'
              '                                path=item_meta.source_path,\n'
              '                                result="failed",\n'
              '                                details_json=json.dumps({\n'
              '                                    "plan_id": plan_id,\n'
              '                                    "item_id": item_meta.id,\n'
              '                                    "task_id": job.id,\n'
              '                                    "quarantine_entry_id": q_entry_id,\n'
              '                                    "reason": recursive_reason,\n'
              '                                    "phase": "recursive_live_preflight",\n'
              '                                }, ensure_ascii=False),\n'
              '                            ))\n'
              '                            session.commit()\n'
              '                        break\n'
              '\n'
              '            result = execute_item(\n'
              '                item_op,\n'
          )
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"Task6 Worker anchor count must be 1, got {count}")
          handlers.write_text(source.replace(old, new, 1), encoding="utf-8")

          service = Path("app/service.py")
          source = service.read_text(encoding="utf-8")
          old = (
              '            if plan.status not in {"ready", "partial"}:\n'
              '                raise ValueError(f"Plan must be validated before execution (status must be \'ready\' or \'partial\'), current status={plan.status}")\n'
              '            rows = list(session.scalars(select(BatchPlanItem).where(BatchPlanItem.plan_id == plan_id).order_by(BatchPlanItem.sequence)))\n'
              '\n'
              '        stale_items = []\n'
          )
          new = (
              '            if plan.status not in {"ready", "partial"}:\n'
              '                raise ValueError(f"Plan must be validated before execution (status must be \'ready\' or \'partial\'), current status={plan.status}")\n'
              '            rows = list(session.scalars(select(BatchPlanItem).where(BatchPlanItem.plan_id == plan_id).order_by(BatchPlanItem.sequence)))\n'
              '\n'
              '            try:\n'
              '                direct_plan_meta = json.loads(plan.metadata_json or "{}")\n'
              '            except Exception:\n'
              '                direct_plan_meta = {}\n'
              '            recursive_direct_execute = (\n'
              '                isinstance(direct_plan_meta, dict)\n'
              '                and direct_plan_meta.get("selection_mode")\n'
              '                == "recursive_directory_balanced_by_bytes"\n'
              '            )\n'
              '            if not recursive_direct_execute:\n'
              '                for row in rows:\n'
              '                    try:\n'
              '                        row_meta = json.loads(row.metadata_json or "{}")\n'
              '                    except Exception:\n'
              '                        row_meta = None\n'
              '                    if (\n'
              '                        isinstance(row_meta, dict)\n'
              '                        and (\n'
              '                            "recursive_protection" in row_meta\n'
              '                            or "frozen_recursive_protection" in row_meta\n'
              '                        )\n'
              '                    ):\n'
              '                        recursive_direct_execute = True\n'
              '                        break\n'
              '            if recursive_direct_execute:\n'
              '                raise StateConflictError(\n'
              '                    "recursive directory balance execution requires the Worker live preflight; "\n'
              '                    "synchronous execute_plan is not an authorized mutation path"\n'
              '                )\n'
              '\n'
              '        stale_items = []\n'
          )
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"Task6 direct-execute anchor count must be 1, got {count}")
          service.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/gate6b-task6-execute-preflight-patch.yml

      - name: Commit exact patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/tasks/handlers_base.py app/service.py .github/workflows/gate6b-task6-execute-preflight-patch.yml
          git diff --cached --check
          git commit -m "feat(gate6b): enforce recursive execute live preflight"
          git push origin HEAD:v0.3.6-gate6b-utility-recursive-dirbal
