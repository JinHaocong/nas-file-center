name: v0.4.0 Release Closure Verification
# final-lock-candidate

on:
  push:
    branches:
      - v0.4.0-release-closure
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONFIG_DIR: /tmp/nfc-config
      DATA_MOUNT: /tmp/nfc-data
      ALLOWED_ROOTS: /tmp/nfc-data
      QUARANTINE_ROOT: /tmp/nfc-data/.nas-file-center-trash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend + test dependencies
        run: python -m pip install -e '.[test]'
      - name: Dependency consistency
        run: python -m pip check
      - name: Full backend regression
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Full frontend regression
        working-directory: frontend
        run: npm test
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Runtime dependency audit
        working-directory: frontend
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=low

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build release Docker image
        run: docker build -t nas-file-center:0.4.0 .
      - name: Inspect release Docker image
        run: |
          docker image inspect nas-file-center:0.4.0 --format '{{.Id}} {{.Architecture}} {{.Os}}'
