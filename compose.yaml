name: nas-file-center

x-common: &common
  image: nas-file-center:1.4.6
  build:
    context: .
    args:
      FCLONES_VERSION: ${FCLONES_VERSION:-0.35.0}
  restart: unless-stopped
  env_file:
    - .env
  environment:
    CONFIG_DIR: /config
    DATA_MOUNT: /data
    ALLOWED_ROOTS: ${ALLOWED_ROOTS:-/data}
    QUARANTINE_ROOT: ${QUARANTINE_ROOT:-/data/.nas-file-center-trash}
    ALLOW_MUTATION: ${ALLOW_MUTATION:-false}
    ALLOW_DELETE: ${ALLOW_DELETE:-false}
    PROTECT_LAST_FILE: ${PROTECT_LAST_FILE:-true}
    FCLONES_BINARY: /usr/local/bin/fclones
    FCLONES_THREADS: ${FCLONES_THREADS:-}
    MTIME_REFRESH_DELAY_SECONDS: ${MTIME_REFRESH_DELAY_SECONDS:-2}
    # V1.6 execution remains independently disabled until NAS acceptance.
    MEDIA_ORGANIZER_EXECUTION_ENABLED: "false"
    MEDIA_ORGANIZER_NAMESPACE_QUIESCENCE_ACK: "false"
    INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-}
    INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:mode=1777

services:
  api:
    <<: *common
    user: "${NFC_API_UID:-10001}:${NFC_SHARED_GID:-10000}"
    volumes:
      - ${HOST_CONFIG_DIR:-./config}:/config
      - ${HOST_DATA_DIR:?Set HOST_DATA_DIR in .env}:/data:ro
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    <<: *common
    user: "${NFC_WORKER_UID:-10002}:${NFC_SHARED_GID:-10000}"
    volumes:
      - ${HOST_CONFIG_DIR:-./config}:/config
      - ${HOST_DATA_DIR:?Set HOST_DATA_DIR in .env}:/data:${DATA_MODE:-ro}
    command: ["python", "-m", "app.worker"]
    depends_on:
      api:
        condition: service_healthy
