name: nas-file-center

x-common: &common
  image: nas-file-center:0.3.2
  build:
    context: .
    args:
      FCLONES_VERSION: ${FCLONES_VERSION:-0.35.0}
  restart: unless-stopped
  env_file:
    - .env
  environment:
    CONFIG_DIR: /config
    DATA_MOUNT: /data
    ALLOWED_ROOTS: ${ALLOWED_ROOTS:-/data}
    QUARANTINE_ROOT: ${QUARANTINE_ROOT:-/data/.nas-file-center-trash}
    ALLOW_MUTATION: ${ALLOW_MUTATION:-false}
    ALLOW_DELETE: ${ALLOW_DELETE:-false}
    PROTECT_LAST_FILE: ${PROTECT_LAST_FILE:-true}
    FCLONES_BINARY: /usr/local/bin/fclones
    FCLONES_THREADS: ${FCLONES_THREADS:-}
    MTIME_REFRESH_DELAY_SECONDS: ${MTIME_REFRESH_DELAY_SECONDS:-2}
    INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-}
    INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
  volumes:
    - ${HOST_CONFIG_DIR:-./config}:/config
    - ${HOST_DATA_DIR:?Set HOST_DATA_DIR in .env}:/data:${DATA_MODE:-ro}

services:
  api:
    <<: *common
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    <<: *common
    command: ["python", "-m", "app.worker"]
    depends_on:
      api:
        condition: service_healthy
